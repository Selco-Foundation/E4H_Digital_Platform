        description: Unique userId defined using user service
        minLength: 2
        maxLength: 64
      projectId:
        type: array
        items:
          type: string
        description: Project Id
        minLength: 2
        maxLength: 64
      startDate:
        type: integer
        format: int64
        description: Start date of user operations against this project
      endDate:
        type: integer
