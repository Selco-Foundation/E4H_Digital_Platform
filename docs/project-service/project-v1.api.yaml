  projectTypeId:
    type: string
    description: Unique id of Project type from master data
    minLength: 2
    maxLength: 64
  subProjectTypeId:
    type: string
    description: Unique id of subproject type from master data
    minLength: 2
    maxLength: 64
  Project:
    description: The purpose of this object to define the Project for a geography
      and period
    type: object
    properties:
      id:
        type: string
        minLength: 2
        maxLength: 64
        description: Unique system generated GUID
        readOnly: true
      tenantId:
        type: string
        minLength: 2
        maxLength: 64
        description: Unique tenant of the system
        example: tenantA
      name:
        type: string
        description: Name of project
        minLength: 2
      projectNumber:
        type: string
        description: The unique identifier of the project number the custom formatting.
        example: PR/2022-23/010
        readOnly: true
      projectType:
        type: string
        description: Unique ID of project type from master data
        minLength: 2
        maxLength: 64
      projectSubType:
        type: string
        description: Unique ID of subproject type from master data
        minLength: 2
        maxLength: 64
      department:
        type: string
        description: Unique department ID as defined in master data
        minLength: 2
        maxLength: 64
      description:
        type: string
        description: Description of project
        minLength: 2
      referenceID:
        type: string
        description: Reference number to a physical file or docket or some other artifact
          of which this project is representative of.
        minLength: 2
        maxLength: 100
      natureOfWork:
        type: string
        description: Specifies nature of work for Project
        minLength: 2
        maxLength: 64
      projectHierarchy:
        type: string
        description: Materialized Path of the hierarchy that this project element
          belongs to
        readOnly: true
      ancestors:
        $ref: '#/definitions/Project'
        description: Materialized Path of the hierarchy that this project element
          belongs to
      address:
        $ref: '#/definitions/Address'
      startDate:
        type: integer
        format: int64
        description: Project start date
      endDate:
        type: integer
        format: int64
        description: Project end date
      isTaskEnabled:
        type: boolean
        default: false
        description: Task can be created if this is 'True'
      parent:
        type: string
        minLength: 2
        maxLength: 64
        description: Parent Project id
      targets:
        type: array
        items:
          $ref: '#/definitions/Target'
      wfStatus:
        type: string
        description: Workflow status of the project. Cannot be updated. Only returned
          in responses.
        readOnly: true
      additionalDetails:
        type: object
        description: Any additional details of the register
      isDeleted:
        $ref: '#/definitions/isDeleted'
      rowVersion:
        $ref: '#/definitions/rowVersion'
      auditDetails:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails
  ProjectSearch:
