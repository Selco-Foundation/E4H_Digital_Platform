# Remove the old /project/v1/workflow/update path definition if it exists. 
parameters:
  # TODO is tenantId required as a query param if it can be determine from requestInfo->userInfo
  tenantId:
    name: tenantId
    in: query
    description: Unique id for a tenant.
    required: true
    type: string
    format: varchar
  lastChangedSince:
    name: lastChangedSince
    description: |
      epoch of the time since when the changes on the object should be picked up. Search results from this parameter should include both newly created objects since this time as well as any modified objects since this time. This criterion is included to help polling clients to get the changes in system since a last time they synchronized with the platform.
    in: query
    required: false
    type: integer
    format: int64
  echoResource:
    name: echoResource
    in: query
    type: boolean
    required: false
    default: true
    description: Client can specify if the resource in request body needs to be sent
      back in the response. This is being used to limit amount of data that needs
      to flow back from the server to the client in low bandwidth scenarios. Server
      will always send the server generated id for validated requests.
  serverHandlesErrors:
    name: serverHandlesErrors
    in: query
    type: boolean
    required: false
    default: false
    description: Client can specify that it is incapable of handling any errors with
      the requests and server should route these for manual intervention if required.
  limit:
    name: limit
    description: Pagination - limit records in response
    in: query
    type: integer
    minimum: 0
    maximum: 1000  # TODO review
    required: true
  offset:
    name: offset
    description: Pagination - offset from which records should be returned in response
    in: query
    type: integer
    minimum: 0
    required: true
  includeDeleted:
    name: includeDeleted
    description: Used in search APIs to specify if (soft) deleted records should be
      included in search results.
    in: query
    type: boolean
    default: false
    required: false
  includeEnded:
    name: includeEnded
    description: Used in project search API to specify if records past end date should
      be included in search results.
    in: query
    type: boolean
    default: false
    required: false
  includeAncestors:
    name: includeAncestors
    description: Used in project search API to specify if response should include
      project elements that are in the preceding hierarchy of matched projects.
    in: query
    type: boolean
    default: false
    required: false
  includeDescendants:
    name: includeDescendants
    description: Used in project search API to specify if response should include
      project elements that are in the following hierarchy of matched projects.
    in: query
    type: boolean
    default: false
    required: false
  createdFrom:
    name: createdFrom
    description: |
      Used in project search API to limit the search results to only those projects whose creation date is after the specified 'createdFrom' date.
    in: query
    required: false
    type: integer
    format: int64
  createdTo:
    name: createdTo
    description: |
      Used in project search API to limit the search results to only those projects whose creation date is before the specified 'createdTo' date.
    in: query
    required: false
    type: integer
    format: int64
definitions:
