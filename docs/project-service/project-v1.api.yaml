        description: List of workflow statuses to filter projects
  ProjectStaff:
    description: This object defines the mapping of a system staff user to a project
      for a certain period.
    type: object
    required: [tenantId, userId, projectId]
    properties:
      id:
        type: string
        minLength: 2
        maxLength: 64
        description: Unique system generated GUID
        readOnly: true
      tenantId:
        $ref: '#/definitions/tenantId'
      userId:
        type: string
        description: Unique userId defined using user service
        minLength: 2
        maxLength: 64
      projectId:
        type: string
        description: Project Id
        minLength: 2
        maxLength: 64
      # TODO: What happens when this period falls outside the period for the project
      # TODO: Could be multiple periods when the user needs to be active for a certain location
      # TODO: User could have different active periods in different locations
      startDate:
        type: integer
        format: int64
        description: Start date of user operations against this project
      endDate:
        type: integer
        format: int64
        description: End date of user operations against this project
      channel:
        type: string
        minLength: 2
        maxLength: 64
      isDeleted:
        $ref: '#/definitions/isDeleted'
      rowVersion:
        $ref: '#/definitions/rowVersion'
      auditDetails:
        $ref: >-
          https://raw.githubusercontent.com/egovernments/egov-services/master/docs/common/contracts/v1-1-1.yml#/definitions/AuditDetails
  ProjectStaffSearch:
