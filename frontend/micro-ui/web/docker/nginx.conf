# index.html, manifest.json and service-worker.js change with every deploy, so browsers must revalidate them
# (ETag makes that a cheap 304). Other files are left to the browser's default caching.
map $uri $selco_cache_control {
  ~(^|/)(index\.html|manifest\.json|service-worker\.js)?$ "no-cache";
  default "";
}

server
{
  listen 80;
  underscores_in_headers on;
  sub_filter_once off;
  add_header Cache-Control $selco_cache_control;
  
  location ~ ^/([a-zA-Z0-9-]+)(/.*)?$ {
        alias /var/web/digit-ui;
        index index.html index.htm;
        try_files $2 /index.html;
    }
    location / {
        root /var/web/digit-ui;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}