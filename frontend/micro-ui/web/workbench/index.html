<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://selco-assets.s3.ap-south-1.amazonaws.com/TwoClr_horizontal_4X.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@egovernments/digit-ui-css@1.9.0/dist/index.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@egovernments/digit-ui-components-css@0.2.3/dist/index.css"
    />
    <!-- Selco theme last so its colours override the DIGIT defaults -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@selco/selco-css@1.8.32/dist/index.css"
    />
    <!-- selco-css adds a "/" after each breadcrumb item, but the DIGIT BreadCrumb already renders its own separator -->
    <style>
      .digit-bread-crumb--item:not(:last-child):after {
        content: none;
      }
      /* the state logo (LOGO_COLORED) can be large, keep the login header compact */
      .bannerHeader .bannerLogo {
        max-height: 100px;
        width: auto;
      }
      /* the header logo box is 2rem x 1.291rem (sized for the eGov logo), too small for the state logo */
      .digit-topbar .digit-logo-ulb-wrapper .digit-topbar-logo {
        height: 56px;
        width: auto;
      }
      .digit-topbar .digit-logo-ulb-wrapper .digit-header-logo-img {
        height: 100%;
        width: auto;
        max-width: none;
      }
      /* the header's second logo slot is stateInfo.logoUrlWhite, which the state tenant doesn't set: hide it instead of a broken image */
      .digit-employee-header img.state:not([src]),
      .digit-employee-header img.state[src=""] {
        display: none;
      }
      /* Manage Master Data (module and master cards). digit-ui-css gives the cards a fixed 22rem width with 8px margins,
         so rows left a wide empty gap on the right and did not line up with the page title; the 36px card titles were cut
         off with "..."; and the search box sat lower than the "Select a module" text. */
      .workbench .module-cards-container,
      .workbench .master-details-container {
        width: 100%;
      }
      .workbench .module-cards-header,
      .workbench .master-details-header {
        align-items: center;
        margin-bottom: 1rem;
      }
      .workbench .module-cards-header .mdms-search-bar-container,
      .workbench .master-details-header .mdms-search-bar-container {
        width: 20rem;
        margin-bottom: 0;
      }
      /* the page passes an inline marginTop to the input, hence !important */
      .workbench .mdms-search-bar-container input {
        margin: 0 !important;
        max-width: none;
      }
      .workbench .mdms-search-bar-container .text-input {
        margin-bottom: 0;
      }
      .workbench .module-cards-grid,
      .workbench .master-cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
        gap: 1rem;
      }
      /* .employeeCard has margin-bottom: 16px !important, which doubled the row gap */
      .workbench .module-cards-grid .employeeCard.module-card,
      .workbench .master-cards-grid .employeeCard.master-card {
        width: auto;
        margin: 0 !important;
        cursor: pointer;
      }
      .workbench .module-cards-grid .module-card .employee-card-sub-header,
      .workbench .master-cards-grid .master-card .employee-card-sub-header {
        font-size: 1.5rem;
        line-height: 2rem;
        margin-bottom: 0.75rem;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .workbench .module-cards-grid .module-card .employee-card-sub-header:hover,
      .workbench .master-cards-grid .master-card .employee-card-sub-header:hover {
        padding: 0;
        margin: 0 0 0.75rem;
      }
      .workbench .module-cards-grid .card-text,
      .workbench .master-cards-grid .card-text {
        margin-bottom: 0;
      }
      /* the breadcrumb row's Help link sat 16px lower than the breadcrumb (its wrapper has a 16px top margin) */
      .wbh-header-container {
        align-items: center;
      }
      .wbh-header-container .wbh-header {
        margin-top: 0;
        margin-bottom: 0;
      }
      /* Add/View/Edit master forms (react-jsonschema-form). Each simple field is a flex row of label (200px),
         description (as wide as its text) and input, so every input started at a different x; lay it out as
         label | description above input instead. Object and array fields keep their own nested layout.
         The selectors repeat digit-ui-css's own (which includes #digit_root) so they take precedence. */
      .workbench .workbench-create-form form #digit_root .field-wrapper .form-group.field:not(.field-object):not(.field-array) {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        column-gap: 2.5rem;
        align-items: start;
      }
      .workbench .workbench-create-form form #digit_root .field-wrapper .form-group.field:not(.field-object):not(.field-array) > * {
        grid-column: 2;
      }
      .workbench .workbench-create-form form #digit_root .field-wrapper .form-group.field:not(.field-object):not(.field-array) > .control-label {
        grid-column: 1;
        grid-row: 1 / span 2;
      }
      .workbench .workbench-create-form form #digit_root .field-wrapper .form-group.field:not(.field-object):not(.field-array) > .field-description {
        margin: 0 0 0.5rem;
      }
      /* the label is an inline-flex row of [text, "*"] at 33% width with a 3rem line height, so a two-line label pushed
         the "*" into its own column; make it plain text filling the 200px label column */
      .workbench .workbench-create-form form #digit_root .field-wrapper .form-group.field .control-label {
        display: block;
        width: auto;
        max-width: none;
        line-height: 1.5rem;
      }
      .workbench .workbench-create-form form #digit_root .field-wrapper .form-group .control-label .tooltip {
        display: inline;
      }
      /* Search screens (master records, localisation): the Search button's wrapper had a 32px margin + 8px padding on
         top, so the button sat lower than the inputs (whose labels take ~30px); line it up and keep both the button and
         "Clear Search" at the right edge of the card */
      /* margin-top and align-items are inline styles from the search component, hence !important */
      .workbench .search-field-wrapper .search-button-wrapper {
        margin-top: 1.9rem !important;
        padding-top: 0;
        align-items: flex-end !important;
      }
      .workbench .search-field-wrapper .search-button-wrapper .link-label {
        width: 240px;
        text-align: center;
      }
      /* the results' filter box: selco-css caps .input-container at 540px inside its 600px box, so the box ended 60px
         before its right-aligned title, and two 24px bottom margins left a gap above the table */
      .workbench .global-search-results-table .input-container {
        max-width: none;
        margin-bottom: 0;
      }
      .workbench .global-search-results-table {
        margin-bottom: 1rem;
      }
      .workbench .global-search-results-table-header {
        margin-bottom: 0.25rem;
      }
      /* the sidebar keeps its last item (Home) marked "selected" on every page, which painted it orange permanently;
         keep the orange for hover only */
      .digit-sidebar .digit-sidebar-item.selected:not(:hover),
      .digit-sidebar.collapsed .digit-sidebar-items-container .item-child-wrapper .digit-sidebar-item.selected:not(:hover) {
        background: transparent;
      }
      /* Add Localisation: the hidden file input behind "Bulk Upload" is wider than the button and stuck out past the
         page edge, giving the page a horizontal scrollbar */
      .workbench div:has(> .hide-input-type-file) {
        position: relative;
      }
      .workbench .hide-input-type-file {
        left: 0;
        width: 100%;
      }
      /* selco-css sets .digit-button-primary/-secondary to height: fit-content (for its older buttons), which overrides
         the component library's 2.5rem for the default "large" size, so e.g. "Back to modules" and the logout dialog's
         "Yes, Logout" collapsed to 22px and cut their labels off */
      .digit-button-primary.large,
      .digit-button-secondary.large {
        height: 2.5rem;
      }
      /* selco-css gives every .input-container a border and side padding (for the old search screens, whose input has no
         border). The DIGIT component library's text inputs use the same class around an input that has its own border,
         so they showed two borders with a gap. Keep only the input's own border. */
      .digit-text-input-field .input-container {
        padding: 0;
        border: 0;
      }
    </style>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00bcd1" />
    <title>Saura-eMitra MDMS Management</title>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
