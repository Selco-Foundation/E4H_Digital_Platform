name: sem-ui Image Build workflow
on:
  push:
    branches:
      - develop
      - staging
    tags:
      - 'v*'
    paths:
      - 'frontend/sem-ui/**'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  Docker_Image_Build:
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/staging') || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Docker Buildx  # Buildx is docker CLI plugin which uses BuildKit capabilities
        uses: docker/setup-buildx-action@v3   # Buildkit is the underling engine that handles the actual building of docker images.

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set Version from Tag or Branch
        id: set_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}  # Use tag name for version
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            # Use branch name as version, replacing '/' with '-'
            VERSION=${GITHUB_REF#refs/heads/}
            VERSION=$(echo "${VERSION}" | sed 's|/|-|g')
          else
            VERSION="latest"  # Default version if not a tag or branch
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Git commit_hash for service
        run: |
          commit_hash=$(git log -1 --pretty=format:%H -- frontend/sem-ui)
          echo "commit_hash=$commit_hash" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/sem-ui/docker/Dockerfile
          push: true
          tags: selcohub/sem-ui:${{ env.VERSION }}-${{ env.commit_hash }}
          cache-from: type=gha   # Stores cache in GitHub Actions
          cache-to: type=gha,mode=max  # max- stores all the layers including the intermediate layers in multi-stage
          build-args: |
            WORK_DIR=frontend/sem-ui/
