name: "CodeQL Security Analysis - E4H Platform"

on:
  push:
    branches: [ "develop", "main", "staging" ]
  pull_request:
    branches: [ "develop", "main", "staging" ]
  schedule:
    # Run at 2:30 AM UTC every Monday (analyzes all languages)
    - cron: '30 2 * * 1'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # Job to detect which backend services have changes
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # Comma-separated lists (safer than JSON for GitHub outputs)
      core_services: ${{ steps.changes.outputs.core_services }}
      e4h_services: ${{ steps.changes.outputs.e4h_services }}
      java_changed: ${{ steps.changes.outputs.java_changed }}
      python_changed: ${{ steps.changes.outputs.python_changed }}
      js_changed: ${{ steps.changes.outputs.js_changed }}
      actions_changed: ${{ steps.changes.outputs.actions_changed }}
      full_analysis: ${{ steps.changes.outputs.full_analysis }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          set -e
          
          # Initialize outputs
          JAVA_CHANGED="false"
          PYTHON_CHANGED="false"
          JS_CHANGED="false"
          ACTIONS_CHANGED="false"
          FULL_ANALYSIS="false"
          CORE_SERVICES=""
          E4H_SERVICES=""
          
          # All available services (for full analysis)
          ALL_CORE_SERVICES="boundary-service,egov-filestore,egov-idgen,egov-mdms-service-v2,egov-notification-sms,egov-workflow-v2,health-facility-registry"
          ALL_E4H_SERVICES="amc-scheduler-service,asset-registry,egov-hrms,field-planner,field-planner-activity,im-services,im-services-analytics,inbox,processor-services,project,vendor-registry"
          
          # For scheduled runs or manual dispatch, analyze everything
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Scheduled or manual run - full analysis"
            FULL_ANALYSIS="true"
            JAVA_CHANGED="true"
            PYTHON_CHANGED="true"
            JS_CHANGED="true"
            ACTIONS_CHANGED="true"
            CORE_SERVICES="$ALL_CORE_SERVICES"
            E4H_SERVICES="$ALL_E4H_SERVICES"
          else
            # For PRs and pushes, detect changed files
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              git fetch origin "${{ github.base_ref }}" --quiet
              CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || echo "")
            else
              # For push events
              if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || echo "")
              else
                # New branch - compare with parent
                CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
              fi
            fi
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "No changed files detected - running full analysis as fallback"
              FULL_ANALYSIS="true"
              JAVA_CHANGED="true"
              PYTHON_CHANGED="true"
              JS_CHANGED="true"
              ACTIONS_CHANGED="true"
              CORE_SERVICES="$ALL_CORE_SERVICES"
              E4H_SERVICES="$ALL_E4H_SERVICES"
            else
              echo "Changed files:"
              echo "$CHANGED_FILES"
              echo ""
              
              # Check for workflow changes
              if echo "$CHANGED_FILES" | grep -qE '\.github/workflows/.*\.(yml|yaml)$'; then
                ACTIONS_CHANGED="true"
              fi
              
              # Check for frontend changes
              if echo "$CHANGED_FILES" | grep -qE '^frontend/.*\.(js|jsx|ts|tsx)$'; then
                JS_CHANGED="true"
              fi
              
              # Check for Python changes in backend
              if echo "$CHANGED_FILES" | grep -qE '^backend/.*\.py$'; then
                PYTHON_CHANGED="true"
              fi
              
              # Detect changed core-services (using comma-separated list)
              CORE_LIST=""
              for service in boundary-service egov-filestore egov-idgen egov-mdms-service-v2 egov-notification-sms egov-workflow-v2 health-facility-registry; do
                if echo "$CHANGED_FILES" | grep -qE "^backend/core-services/${service}/.*\.(java|kt|xml)$"; then
                  if [ -n "$CORE_LIST" ]; then
                    CORE_LIST="${CORE_LIST},${service}"
                  else
                    CORE_LIST="${service}"
                  fi
                  JAVA_CHANGED="true"
                fi
              done
              CORE_SERVICES="$CORE_LIST"
              
              # Detect changed e4h-services (using comma-separated list)
              E4H_LIST=""
              for service in amc-scheduler-service asset-registry egov-hrms field-planner field-planner-activity im-services im-services-analytics inbox processor-services project vendor-registry; do
                if echo "$CHANGED_FILES" | grep -qE "^backend/e4h-services/${service}/.*\.(java|kt|xml)$"; then
                  if [ -n "$E4H_LIST" ]; then
                    E4H_LIST="${E4H_LIST},${service}"
                  else
                    E4H_LIST="${service}"
                  fi
                  JAVA_CHANGED="true"
                fi
              done
              E4H_SERVICES="$E4H_LIST"
            fi
          fi
          
          # Output results (all single-line strings, no JSON)
          echo "java_changed=${JAVA_CHANGED}" >> $GITHUB_OUTPUT
          echo "python_changed=${PYTHON_CHANGED}" >> $GITHUB_OUTPUT
          echo "js_changed=${JS_CHANGED}" >> $GITHUB_OUTPUT
          echo "actions_changed=${ACTIONS_CHANGED}" >> $GITHUB_OUTPUT
          echo "full_analysis=${FULL_ANALYSIS}" >> $GITHUB_OUTPUT
          echo "core_services=${CORE_SERVICES}" >> $GITHUB_OUTPUT
          echo "e4h_services=${E4H_SERVICES}" >> $GITHUB_OUTPUT
          
          echo ""
          echo "=== Detection Summary ==="
          echo "Java: ${JAVA_CHANGED} | Python: ${PYTHON_CHANGED} | JS/TS: ${JS_CHANGED} | Actions: ${ACTIONS_CHANGED}"
          echo "Core services: ${CORE_SERVICES:-none}"
          echo "E4H services: ${E4H_SERVICES:-none}"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.language == 'java-kotlin' && 360) || 120 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine if this language needs full analysis
      - name: Check if analysis needed
        id: check
        run: |
          SHOULD_ANALYZE="false"
          
          if [ "${{ needs.detect-changes.outputs.full_analysis }}" == "true" ]; then
            SHOULD_ANALYZE="true"
            echo "Full analysis mode - analyzing ${{ matrix.language }}"
          elif [ "${{ matrix.language }}" == "actions" ] && [ "${{ needs.detect-changes.outputs.actions_changed }}" == "true" ]; then
            SHOULD_ANALYZE="true"
            echo "Workflow files changed - analyzing actions"
          elif [ "${{ matrix.language }}" == "java-kotlin" ] && [ "${{ needs.detect-changes.outputs.java_changed }}" == "true" ]; then
            SHOULD_ANALYZE="true"
            echo "Java files changed - analyzing java-kotlin"
          elif [ "${{ matrix.language }}" == "javascript-typescript" ] && [ "${{ needs.detect-changes.outputs.js_changed }}" == "true" ]; then
            SHOULD_ANALYZE="true"
            echo "Frontend files changed - analyzing javascript-typescript"
          elif [ "${{ matrix.language }}" == "python" ] && [ "${{ needs.detect-changes.outputs.python_changed }}" == "true" ]; then
            SHOULD_ANALYZE="true"
            echo "Python files changed - analyzing python"
          else
            echo "⏭️ No relevant changes for ${{ matrix.language }} - skipping heavy analysis"
          fi
          
          echo "should_analyze=${SHOULD_ANALYZE}" >> $GITHUB_OUTPUT

      # Setup steps - only run if needed
      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin' && steps.check.outputs.should_analyze == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        if: matrix.language == 'python' && steps.check.outputs.should_analyze == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        if: matrix.language == 'javascript-typescript' && steps.check.outputs.should_analyze == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'
          cache-dependency-path: frontend/micro-ui/web/yarn.lock

      # Initialize CodeQL - always runs to maintain category
      # NOTE: For Java with manual build mode, CodeQL init MUST come before build
      # so it can instrument/trace the compilation process
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # Build Java services - runs AFTER CodeQL init (required for tracing)
      - name: Build Changed Backend Services (Java)
        if: matrix.language == 'java-kotlin' && steps.check.outputs.should_analyze == 'true'
        env:
          CORE_SERVICES: ${{ needs.detect-changes.outputs.core_services }}
          E4H_SERVICES: ${{ needs.detect-changes.outputs.e4h_services }}
        run: |
          set -e
          echo "Building changed E4H Backend Services..."
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo ""
          
          SUCCESSFUL=0
          FAILED=0
          
          # Parse comma-separated service lists
          IFS=',' read -ra CORE_ARRAY <<< "$CORE_SERVICES"
          IFS=',' read -ra E4H_ARRAY <<< "$E4H_SERVICES"
          
          echo "Core services to build: ${CORE_SERVICES:-none}"
          echo "E4H services to build: ${E4H_SERVICES:-none}"
          echo ""
          
          # Build core-services individually (each has its own pom.xml, no parent dependency)
          if [ -n "$CORE_SERVICES" ]; then
            echo "=== Building Core Services ==="
            for service in "${CORE_ARRAY[@]}"; do
              if [ -z "$service" ]; then continue; fi
              SERVICE_DIR="backend/core-services/${service}"
              if [ -d "$SERVICE_DIR" ] && [ -f "$SERVICE_DIR/pom.xml" ]; then
                echo "Building ${service}..."
                cd "$SERVICE_DIR"
                # Use -N to skip child modules if any, -B for batch mode
                if mvn clean compile -DskipTests -Dmaven.javadoc.skip=true -B 2>&1 | tail -20; then
                  echo "✅ ${service}"
                  SUCCESSFUL=$((SUCCESSFUL + 1))
                else
                  echo "⚠️ ${service} - build failed, continuing..."
                  FAILED=$((FAILED + 1))
                fi
                cd - > /dev/null
              else
                echo "⚠️ ${service} - directory or pom.xml not found"
              fi
            done
          fi
          
          # Build e4h-services individually
          if [ -n "$E4H_SERVICES" ]; then
            echo ""
            echo "=== Building E4H Services ==="
            for service in "${E4H_ARRAY[@]}"; do
              if [ -z "$service" ]; then continue; fi
              SERVICE_DIR="backend/e4h-services/${service}"
              if [ -d "$SERVICE_DIR" ] && [ -f "$SERVICE_DIR/pom.xml" ]; then
                echo "Building ${service}..."
                cd "$SERVICE_DIR"
                if mvn clean compile -DskipTests -Dmaven.javadoc.skip=true -B 2>&1 | tail -20; then
                  echo "✅ ${service}"
                  SUCCESSFUL=$((SUCCESSFUL + 1))
                else
                  echo "⚠️ ${service} - build failed, continuing..."
                  FAILED=$((FAILED + 1))
                fi
                cd - > /dev/null
              else
                echo "⚠️ ${service} - directory or pom.xml not found"
              fi
            done
          fi
          
          echo ""
          echo "=== Build Summary ==="
          echo "✅ Successful: ${SUCCESSFUL}"
          echo "⚠️ Failed: ${FAILED}"
          
          # Only fail if ALL attempted services failed AND we had services to build
          TOTAL=$((SUCCESSFUL + FAILED))
          if [ "$TOTAL" -gt 0 ] && [ "$SUCCESSFUL" -eq 0 ]; then
            echo "❌ All services failed to build"
            exit 1
          fi
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "ℹ️ No services to build"
          fi

      - name: Install Frontend Dependencies
        if: matrix.language == 'javascript-typescript' && steps.check.outputs.should_analyze == 'true'
        working-directory: frontend
        run: |
          set -e
          if [ -d "installation-ui" ] && [ -f "installation-ui/package.json" ]; then
            echo "Installing installation-ui dependencies..."
            cd installation-ui
            npm install --legacy-peer-deps || npm install --force || echo "⚠️ installation-ui install had issues"
            cd ..
          fi
          if [ -d "micro-ui/web" ] && [ -f "micro-ui/web/package.json" ]; then
            echo "Installing micro-ui dependencies..."
            cd micro-ui/web
            npm install --legacy-peer-deps || npm install --force || echo "⚠️ micro-ui install had issues"
            cd ../..
          fi

      - name: Install Python Dependencies
        if: matrix.language == 'python' && steps.check.outputs.should_analyze == 'true'
        run: |
          if [ -f "backend/e4h-services/ingestion-service/requirements.txt" ]; then
            pip install -r backend/e4h-services/ingestion-service/requirements.txt || echo "⚠️ Some Python deps failed"
          fi

      # Analyze - always runs to upload category to GitHub
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
