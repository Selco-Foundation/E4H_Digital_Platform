name: "CodeQL Security Analysis - E4H Platform"

on:
  push:
    branches: [ "develop", "main", "staging" ]
  pull_request:
    branches: [ "develop", "main", "staging" ]
  schedule:
    # Run at 2:30 AM UTC every Monday (analyzes all languages)
    - cron: '30 2 * * 1'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.language == 'java-kotlin' && 360) || 120 }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about CodeQL's advanced setup for code scanning, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for better analysis

    # Check if this language should be analyzed
    # For PRs: only analyze if relevant files were changed
    # For push/schedule: always analyze all languages
    - name: Check if language should be analyzed
      id: check_files
      run: |
        SHOULD_RUN="true"
        
        # For pull requests, check if relevant files were changed
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "This is a PR - checking for changed files of type: ${{ matrix.language }}"
          
          # Get list of changed files
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          if [ "${{ matrix.language }}" == "actions" ]; then
            if echo "$CHANGED_FILES" | grep -E '\.(yml|yaml)$' | grep -q '.github/workflows/'; then
              SHOULD_RUN="true"
              echo "Found changed workflow files"
            else
              SHOULD_RUN="false"
              echo "No workflow files changed in this PR"
            fi
          elif [ "${{ matrix.language }}" == "java-kotlin" ]; then
            if echo "$CHANGED_FILES" | grep -qE '\.(java|kt)$'; then
              SHOULD_RUN="true"
              echo "Found changed Java/Kotlin files"
            else
              SHOULD_RUN="false"
              echo "No Java/Kotlin files changed in this PR"
            fi
          elif [ "${{ matrix.language }}" == "javascript-typescript" ]; then
            if echo "$CHANGED_FILES" | grep -qE '\.(js|jsx|ts|tsx)$'; then
              SHOULD_RUN="true"
              echo "Found changed JavaScript/TypeScript files"
            else
              SHOULD_RUN="false"
              echo "No JavaScript/TypeScript files changed in this PR"
            fi
          elif [ "${{ matrix.language }}" == "python" ]; then
            if echo "$CHANGED_FILES" | grep -qE '\.py$'; then
              SHOULD_RUN="true"
              echo "Found changed Python files"
            else
              SHOULD_RUN="false"
              echo "No Python files changed in this PR"
            fi
          fi
        else
          echo "Not a PR (push/schedule/manual) - analyzing all languages"
          SHOULD_RUN="true"
        fi
        
        echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

    - name: Skip analysis message
      if: steps.check_files.outputs.should_run == 'false'
      run: |
        echo "✅ Skipping ${{ matrix.language }} analysis - no relevant files changed in this PR"
        echo "This is expected behavior - not all PRs will change all languages."
        echo "Job completes successfully without running CodeQL for this language."

    - name: Set up JDK 17 for Java (Primary) and JDK 8 (Legacy Services)
      if: matrix.language == 'java-kotlin' && steps.check_files.outputs.should_run == 'true'
      uses: actions/setup-java@v4
      with:
        # Using Java 17 as primary - it can compile and analyze Java 8 code
        # Java 8 services: egov-workflow-v2, inbox, egov-notification-sms, egov-idgen
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Python
      if: matrix.language == 'python' && steps.check_files.outputs.should_run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up Node.js
      if: matrix.language == 'javascript-typescript' && steps.check_files.outputs.should_run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      if: steps.check_files.outputs.should_run == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        queries: security-extended,security-and-quality

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    # Manual build for E4H Java backend services
    # Note: Most services use Java 17, but some legacy services use Java 8:
    #   - egov-workflow-v2, inbox, egov-notification-sms, egov-idgen
    # Java 17 compiler can compile Java 8 code, so using Java 17 for all builds
    - name: Build E4H Backend Services
      if: matrix.language == 'java-kotlin' && steps.check_files.outputs.should_run == 'true'
      working-directory: E4H_Digital_Platform
      run: |
        echo "Building E4H Backend Services with Java 17..."
        echo "Java version: $(java -version 2>&1 | head -n 1)"
        
        # Build core-services (mix of Java 17 and Java 8)
        if [ -d "backend/core-services" ]; then
          echo "=== Building E4H core-services ==="
          cd backend/core-services
          for service_dir in */; do
            if [ -f "$service_dir/pom.xml" ]; then
              echo "Building $service_dir"
              cd "$service_dir"
              # Java 17 can compile Java 8 projects
              mvn clean install -DskipTests -Dmaven.javadoc.skip=true -Dmaven.compiler.release=8 || echo "Build failed for $service_dir, continuing..."
              cd ..
            fi
          done
          cd ../..
        fi
        
        # Build e4h-services (mostly Java 17, inbox uses Java 8)
        if [ -d "backend/e4h-services" ]; then
          echo "=== Building E4H e4h-services ==="
          cd backend/e4h-services
          for service_dir in */; do
            if [ -f "$service_dir/pom.xml" ]; then
              echo "Building $service_dir"
              cd "$service_dir"
              mvn clean install -DskipTests -Dmaven.javadoc.skip=true || echo "Build failed for $service_dir, continuing..."
              cd ..
            fi
          done
          cd ../..
        fi

    - name: Install JavaScript Dependencies
      if: matrix.language == 'javascript-typescript' && steps.check_files.outputs.should_run == 'true'
      working-directory: E4H_Digital_Platform/frontend
      run: |
        # Install dependencies for installation-ui
        if [ -d "installation-ui" ] && [ -f "installation-ui/package.json" ]; then
          echo "Installing dependencies for installation-ui..."
          cd installation-ui
          npm install || echo "npm install failed for installation-ui"
          cd ..
        fi
        
        # Install dependencies for micro-ui
        if [ -d "micro-ui/web" ] && [ -f "micro-ui/web/package.json" ]; then
          echo "Installing dependencies for micro-ui..."
          cd micro-ui/web
          npm install || echo "npm install failed for micro-ui"
          cd ../..
        fi

    - name: Install Python Dependencies
      if: matrix.language == 'python' && steps.check_files.outputs.should_run == 'true'
      working-directory: E4H_Digital_Platform/backend
      run: |
        # Install Python dependencies if requirements.txt exists
        if [ -f "e4h-services/requirements.txt" ]; then
          pip install -r e4h-services/requirements.txt || echo "pip install failed"
        fi

    - name: Perform CodeQL Analysis
      if: steps.check_files.outputs.should_run == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

