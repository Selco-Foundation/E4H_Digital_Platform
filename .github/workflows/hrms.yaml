name: HRMS Image Build workflow
on:
  push:
    branches:
      - develop
      - staging
    paths:
      - 'backend/e4h-services/egov-hrms/**'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  Docker_Image_Build:
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/staging'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Docker Buildx  # Buildx is docker CLI plugin which uses BuildKit capabilities
        uses: docker/setup-buildx-action@v3   # Buildkit is the underling engine that handles the actual building of docker images.

      - name: Set Version from Tag or Branch
        id: set_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}  # Use tag name for version
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            # Use branch name as version, replacing '/' with '-'
            VERSION=${GITHUB_REF#refs/heads/}
            VERSION=$(echo "${VERSION}" | sed 's|/|-|g')
          else
            VERSION="latest"  # Default version if not a tag or branch
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Git commit_hash for service
        run: |
          commit_hash=$(git log -1 --pretty=format:%H -- backend/e4h-services/egov-hrms)
          echo "commit_hash=$commit_hash" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Login to Docker Container Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Jar file
        run: mvn -B -f backend/core-services/egov-hrms/pom.xml package

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/maven/Dockerfile
          push: true
          tags: selcohub/hrms:${{ env.VERSION }}-${{ env.commit_hash }}
          cache-from: type=gha   # Stores cache in GitHub Actions .
          cache-to: type=gha,mode=max  # max- stores all the layers including the intermediate layers in multi-stage
          build-args: |
            JAR_FILE=backend/core-services/egov-hrms/target/*.jar

      - name: Build and Push Docker image for hrms-Service-DB
        run: |
          docker build  -t selcohub/hrms-db:${{ env.VERSION }}-${{ env.commit_hash }} -f  Dockerfile .
          docker push selcohub/hrms-db:${{ env.VERSION }}-${{ env.commit_hash }}
        working-directory: backend/e4h-services/egov-hrms/src/main/resources/db

  Workflow_Trigger:
    if: startsWith(github.ref, 'refs/heads/develop')
    runs-on: ubuntu-latest
    needs: Docker_Image_Build
    steps:
      - name: Trigger Deployment Pipeline
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GHUB_TOKEN }}" \
          https://api.github.com/repos/Selco-Foundation/DIGIT-DevOps/actions/workflows/Dev.yaml/dispatches \
          -d '{"ref":"Selco-Dev"}'
