    # ========================
    # MOBILE SYNC SCHEMAS
    # ========================

    MobileSyncRequest:
      type: object
      description: Request for mobile sync operations
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        SyncRequest:
          $ref: '#/components/schemas/SyncRequest'
      required:
        - RequestInfo
        - SyncRequest

    SyncRequest:
      type: object
      description: Mobile sync request details
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          description: User ID requesting sync
        lastSyncTimestamp:
          type: integer
          format: int64
          description: Last sync timestamp
        deviceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Mobile device ID
        batchSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Batch size for sync
        syncType:
          type: string
          enum: [ASSIGNMENTS, REPORTS, MASTERDATA]
          description: Type of data to sync
      required:
        - userId
        - lastSyncTimestamp
        - deviceId

    MobileSyncResponse:
      type: object
      description: Response for mobile sync operations
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        SyncResponse:
          $ref: '#/components/schemas/SyncResponse'
      required:
        - ResponseInfo
        - SyncResponse

    SyncResponse:
      type: object
      description: Mobile sync response details
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/FacilityAssignment'
          description: User assignments
        deletedAssignments:
          type: array
          items:
            type: string
          description: IDs of deleted assignments
        hasMore:
          type: boolean
          description: Whether more data is available
        nextSyncTimestamp:
          type: integer
          format: int64
          description: Next sync timestamp
        totalRecords:
          type: integer
          minimum: 0
          description: Total number of records synced

    BulkUploadResponse:
      type: object
      description: Response for bulk upload operations
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        UploadResults:
          type: array
          items:
            $ref: '#/components/schemas/UploadResult'
          description: Array of upload results
      required:
        - ResponseInfo
        - UploadResults

    UploadResult:
      type: object
      description: Individual upload result
      properties:
        reportId:
          type: string
          minLength: 1
          maxLength: 64
          description: Generated report ID
        status:
          type: string
          enum: [successful, failed]
          description: Upload status
        error:
          $ref: '#/components/schemas/Error'
          description: Error details if failed
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Uploaded attachments

    MasterDataSyncRequest:
      type: object
      description: Request for master data sync
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        MasterDataTypes:
          type: array
          items:
            type: string
            enum: [ACTIVITY_TYPES, STATUS_CODES, DOCUMENT_TYPES, WORKFLOW_CONFIG]
          description: Types of master data to sync
        lastSyncTimestamp:
          type: integer
          format: int64
          description: Last master data sync timestamp
      required:
        - RequestInfo
        - MasterDataTypes

    MasterDataSyncResponse:
      type: object
      description: Response for master data sync
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        MasterData:
          type: object
          additionalProperties: true
          description: Master data by type
        lastSyncTimestamp:
          type: integer
          format: int64
          description: Current sync timestamp
      required:
        - ResponseInfo
        - MasterData
        - lastSyncTimestamp

    # ========================
    # TEAM MANAGEMENT SCHEMAS
    # ========================

    TeamAssignmentSearchRequest:
      type: object
      description: Request to search team assignments
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        SearchCriteria:
          $ref: '#/components/schemas/TeamSearchCriteria'
      required:
        - RequestInfo
        - SearchCriteria

    TeamSearchCriteria:
      type: object
      description: Criteria for team assignment search
      properties:
        userId:
          type: string
          maxLength: 64
          description: User ID to search for
        supervisorId:
          type: string
          maxLength: 64
          description: Supervisor ID to search for
        organizationId:
          type: string
          maxLength: 64
          description: Organization ID
        roleCode:
          type: string
          maxLength: 64
          description: Role code to filter by
        fieldPlanId:
          type: string
          maxLength: 64
          description: Field plan ID to filter by
        activityType:
          type: string
          enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          description: Activity type to filter by
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Pagination offset
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Pagination limit

    TeamAssignmentSearchResponse:
      type: object
      description: Response for team assignment search
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        TeamAssignments:
          type: array
          items:
            $ref: '#/components/schemas/TeamAssignment'
          description: Array of team assignments
        Pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - ResponseInfo
        - TeamAssignments

    # ========================
    # COMMON ENTITY SCHEMAS
    # ========================

    FieldPlan:
      type: object
      description: Field plan entity
      properties:
        id:
          type: string
          maxLength: 64
          description: Field plan ID (auto-generated)
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Field plan name
        projectId:
          type: string
          minLength: 1
          maxLength: 64
          description: Associated project ID
        startDate:
          type: integer
          format: int64
          description: Field plan start date
        endDate:
          type: integer
          format: int64
          description: Field plan end date
        status:
          type: string
          enum: [DRAFT, ACTIVE, COMPLETED, CANCELLED]
          description: Field plan status (MDMS code)
        activities:
          type: array
          items:
            type: string
            enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          minItems: 1
          description: Planned activities (MDMS codes)
        facilities:
          type: array
          items:
            type: string
          description: Associated facility IDs
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID
        auditDetails:
          $ref: '#/components/schemas/AuditDetails'
      required:
        - name
        - projectId
        - startDate
        - endDate
        - activities
        - tenantId

    FacilityActivity:
      type: object
      description: Facility activity mapping entity
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Facility activity mapping ID
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID
        fieldPlanId:
          type: string
          minLength: 1
          maxLength: 64
          description: Field plan ID
        facilityId:
          type: string
          minLength: 1
          maxLength: 64
          description: Health facility ID
        activityId:
          type: string
          minLength: 1
          maxLength: 64
          description: Activity ID (master data)
        status:
          type: string
          minLength: 1
          maxLength: 64
          description: Facility activity status (master data code)
        assignedUserId:
          type: string
          minLength: 1
          maxLength: 64
          description: Assigned field user ID
        priorityCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Priority (master data code)
        isActive:
          type: boolean
          description: Activation status
        targetCompletionDate:
          type: integer
          format: int64
          description: Target completion date
        actualCompletionDate:
          type: integer
          format: int64
          description: Actual completion date
        activationConditions:
          type: array
          items:
            type: object
            properties:
              conditionType:
                type: string
                minLength: 1
                maxLength: 64
                description: Condition type (master data code)
              conditionDescription:
                type: string
                minLength: 1
                maxLength: 512
                description: Condition description
              isMet:
                type: boolean
                description: Whether condition is met
              checkDate:
                type: integer
                format: int64
                description: Last check date
          minItems: 0
          description: Activation conditions
        additionalDetails:
          type: object
          description: Additional details
        auditDetails:
          $ref: '#/components/schemas/AuditDetails'
      required:
        - id
        - tenantId
        - fieldPlanId
        - facilityId
        - activityId
        - status

    ActivityReport:
      type: object
      description: Activity report entity
      properties:
        id:
          type: string
          maxLength: 64
          description: Report ID (auto-generated)
        facilityActivityId:
          type: string
          minLength: 1
          maxLength: 64
          description: Associated facility activity ID
        facilityId:
          type: string
          minLength: 1
          maxLength: 64
          description: Health facility ID
        activityType:
          type: string
          enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          description: Activity type (MDMS code)
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, FLAGGED_FOR_QC]
          description: Report status (MDMS code)
        reportData:
          type: object
          additionalProperties: true
          description: Activity-specific report data
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Report attachments
        comments:
          type: string
          maxLength: 1000
          description: Report comments
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID
        auditDetails:
          $ref: '#/components/schemas/AuditDetails'
      required:
        - facilityActivityId
        - facilityId
        - activityType
        - status
        - tenantId

    TeamAssignment:
      type: object
      description: Team assignment information
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          description: User ID
        userName:
          type: string
          minLength: 1
          maxLength: 64
          description: Username
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Full name
        roleCode:
          type: string
          minLength: 1
          maxLength: 64
          description: Role code
        roleName:
          type: string
          minLength: 1
          maxLength: 128
          description: Role name
        supervisorId:
          type: string
          maxLength: 64
          description: Supervisor ID
        supervisorName:
          type: string
          maxLength: 128
          description: Supervisor name
        organizationId:
          type: string
          minLength: 1
          maxLength: 64
          description: Organization ID
        organizationName:
          type: string
          minLength: 1
          maxLength: 128
          description: Organization name
        fieldPlanId:
          type: string
          maxLength: 64
          description: Associated field plan ID
        activityType:
          type: string
          enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          description: Associated activity type
      required:
        - userId
        - userName
        - name
        - roleCode
        - roleName
        - organizationId
        - organizationName

    Attachment:
      type: object
      description: File attachment information
      properties:
        id:
          type: string
          maxLength: 64
          description: Attachment ID
        fileName:
          type: string
          minLength: 1
          maxLength: 256
          description: Original file name
        fileStoreId:
          type: string
          minLength: 1
          maxLength: 64
          description: File store ID
        documentType:
          type: string
          enum: [INSTALLATION_REPORT, QC_CHECKLIST, PHOTO_EVIDENCE, HANDOVER_CERTIFICATE]
          description: Document type (MDMS code)
        fileSize:
          type: integer
          minimum: 0
          description: File size in bytes
        mimeType:
          type: string
          minLength: 1
          maxLength: 128
          description: MIME type
        uploadedBy:
          type: string
          minLength: 1
          maxLength: 64
          description: User who uploaded the file
        uploadedAt:
          type: integer
          format: int64
          description: Upload timestamp
      required:
        - fileName
        - fileStoreId
        - documentType
        - fileSize
        - mimeType
        - uploadedBy
        - uploadedAt

    Pagination:
      type: object
      description: Pagination information
      properties:
        offset:
          type: integer
          minimum: 0
          description: Current offset
        limit:
          type: integer
          minimum: 1
          description: Page size
        totalCount:
          type: integer
          minimum: 0
          description: Total number of records
        hasNext:
          type: boolean
          description: Whether more records are available
      required:
        - offset
        - limit
        - totalCount
        - hasNext

tags:
  - name: Field Plans
    description: Bulk field plan creation and management operations
  - name: Activities
    description: Activity assignment within field plan context
  - name: Activity Reports
    description: Activity report creation, submission, and workflow management
  - name: Mobile Sync
    description: Mobile application data synchronization (leveraging platform APIs)
  - name: Team Management
    description: Team assignment tracking across field plans (leveraging HRMS)
