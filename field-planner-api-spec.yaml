            properties:
              fieldPlanId:
                type: string
                maxLength: 64
              facilityId:
                type: string
                maxLength: 64
              status:
                type: string
                enum: [successful, failed]
              error:
                $ref: '#/components/schemas/Error'
          description: Per-assignment result
      required:
        - ResponseInfo
        - Results

    FacilityAssignmentResult:
      type: object
