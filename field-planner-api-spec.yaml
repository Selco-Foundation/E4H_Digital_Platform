        activityType:
          type: string
          enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          description: Activity type
        assignedUserId:
          type: string
          minLength: 1
          maxLength: 64
          description: Assigned field staff ID
        status:
          type: string
          enum: [successful, failed]
          description: Assignment status
        error:
          $ref: '#/components/schemas/Error'
          description: Error details if failed

