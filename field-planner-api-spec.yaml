    ActivityAssignment:
      type: object
      description: Individual activity assignment
      properties:
        activityType:
          type: string
          enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          description: Activity type (MDMS code)
        spocId:
          type: string
          minLength: 1
          maxLength: 64
          description: SPOC employee ID
        startDate:
          type: integer
          format: int64
          description: Activity start date
        endDate:
          type: integer
          format: int64
          description: Activity end date
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: Activity priority (MDMS code)
      required:
        - activityType
        - spocId
        - startDate
        - endDate

    ActivityAssignmentResponse:
      type: object
      description: Response for activity assignments
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        ActivityAssignments:
          type: array
          items:
