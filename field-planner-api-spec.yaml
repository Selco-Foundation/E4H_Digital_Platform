                type: string
                minLength: 1
                maxLength: 64
              activityTypes:
                type: array
                minItems: 1
                items:
                  type: string
                  enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
                description: Activities to schedule for this facility
            required:
              - fieldPlanId
              - facilityId
              - activityTypes
      required:
        - RequestInfo
        - Assignments

