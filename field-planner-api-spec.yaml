          $ref: '#/components/schemas/RequestInfo'
        ActivityReports:
          type: array
          items:
            type: object
            properties:
              tenantId:
                type: string
                minLength: 1
                maxLength: 64
                description: Tenant ID
              facilityActivityId:
                type: string
                minLength: 1
                maxLength: 64
                description: Associated facility activity ID
              facilityId:
                type: string
                minLength: 1
                maxLength: 64
                description: Health facility ID
              reportTypeCode:
                type: string
                minLength: 1
                maxLength: 64
                description: Report type (master data code)
              reportData:
                type: object
                description: Report data
              attachments:
                type: array
                items:
                  type: object
                  properties:
                    fileStoreId:
                      type: string
                      minLength: 1
                      maxLength: 64
                    fileName:
                      type: string
                      minLength: 1
                      maxLength: 256
                    fileType:
                      type: string
                      minLength: 1
                      maxLength: 64
                minItems: 0
                description: Report attachments
              geoLocation:
                type: object
                properties:
                  latitude:
                    type: number
                    format: double
                    minimum: -90
                    maximum: 90
                  longitude:
                    type: number
                    format: double
                    minimum: -180
                    maximum: 180
                  accuracy:
                    type: number
                    format: double
                    minimum: 0
                description: Geo-location data
              additionalDetails:
                type: object
                description: Additional details
            required:
              - tenantId
              - facilityActivityId
              - facilityId
              - reportTypeCode
              - reportData
          minItems: 1
          description: Array of activity reports to create
      required:
        - RequestInfo
        - ActivityReports

    UpdateActivityReportsRequest:
      type: object
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        ActivityReports:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
                description: Activity report ID
              tenantId:
                type: string
                minLength: 1
                maxLength: 64
                description: Tenant ID
              reportData:
                type: object
                description: Updated report data
              attachments:
                type: array
                items:
                  type: object
                  properties:
                    fileStoreId:
                      type: string
                      minLength: 1
                      maxLength: 64
                    fileName:
                      type: string
                      minLength: 1
                      maxLength: 256
                    fileType:
                      type: string
                      minLength: 1
                      maxLength: 64
                minItems: 0
                description: Updated attachments
              additionalDetails:
                type: object
                description: Additional details
            required:
              - id
              - tenantId
          minItems: 1
          description: Array of activity reports to update
      required:
        - RequestInfo
        - ActivityReports

    ActivityReportSearchRequest:
      type: object
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        ActivityReportSearchCriteria:
          type: object
          properties:
            tenantId:
              type: string
              minLength: 1
              maxLength: 64
              description: Tenant ID
            ids:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Activity report IDs
            facilityActivityIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Facility activity IDs
            facilityIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Health facility IDs
            reportTypeCodes:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Report types (master data codes)
            statusCodes:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Report statuses (master data codes)
            submittedBy:
              type: string
              minLength: 1
              maxLength: 64
              description: Submitted by user ID
            reviewedBy:
              type: string
              minLength: 1
              maxLength: 64
              description: Reviewed by user ID
            fromDate:
              type: integer
              format: int64
              description: Filter from date
            toDate:
              type: integer
              format: int64
              description: Filter to date
            assignedToMe:
              type: boolean
              description: Filter for reports assigned to current user
          required:
            - tenantId
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - RequestInfo
        - ActivityReportSearchCriteria

    ActivityReportsResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        ActivityReports:
          type: array
          items:
            $ref: '#/components/schemas/ActivityReport'
          minItems: 0
      required:
        - ResponseInfo
        - ActivityReports

    ActivityReportSearchResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        ActivityReports:
          type: array
          items:
            $ref: '#/components/schemas/ActivityReport'
          minItems: 0
        TotalCount:
          type: integer
          description: Total number of activity reports
      required:
        - ResponseInfo
        - ActivityReports

    ActivityReportWorkflowRequest:
      type: object
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        WorkflowActions:
          type: array
          items:
            type: object
            properties:
              activityReportId:
                type: string
                minLength: 1
                maxLength: 64
                description: Activity report ID
              tenantId:
                type: string
                minLength: 1
                maxLength: 64
                description: Tenant ID
              action:
                type: string
                minLength: 1
                maxLength: 64
                description: Workflow action (master data code - SUBMIT, APPROVE, REJECT, FLAG_FOR_QC)
              comments:
                type: string
                maxLength: 1024
                description: Workflow comments
              additionalDetails:
                type: object
                description: Additional workflow details
            required:
              - activityReportId
              - tenantId
              - action
          minItems: 1
          description: Array of workflow actions to perform
      required:
        - RequestInfo
        - WorkflowActions

    # ========================
    # MOBILE SYNC SCHEMAS
    # ========================

    MobileAssignmentSyncRequest:
      type: object
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        SyncRequest:
          type: object
          properties:
            tenantId:
              type: string
              minLength: 1
              maxLength: 64
              description: Tenant ID
            userId:
              type: string
              minLength: 1
              maxLength: 64
              description: User ID
            lastSyncTime:
              type: integer
              format: int64
              description: Last sync timestamp (0 for full sync)
            deviceInfo:
              type: object
              properties:
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Device ID
                platform:
                  type: string
                  enum: [ANDROID, IOS]
                  description: Device platform
                appVersion:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: App version
              description: Device information
          required:
            - tenantId
            - userId
      required:
        - RequestInfo
        - SyncRequest

    MobileAssignmentSyncResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        SyncData:
          type: object
          properties:
            userProfile:
              type: object
              description: User profile data (from HRMS)
            facilityAssignments:
              type: array
              items:
                $ref: '#/components/schemas/FacilityActivity'
              minItems: 0
              description: User's facility activity assignments
            facilityDetails:
              type: array
              items:
                type: object
              minItems: 0
              description: Health facility details (from HFR bulk API)
            masterData:
              type: object
              description: Relevant master data for offline use (from MDMS)
            formTemplates:
              type: object
              description: Activity-specific form templates
            syncTimestamp:
              type: integer
              format: int64
              description: Current sync timestamp
      required:
        - ResponseInfo
        - SyncData

    MobileReportUploadResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        UploadResults:
          type: object
          properties:
            totalReports:
              type: integer
              description: Total reports in upload batch
            successfulReports:
              type: integer
              description: Successfully processed reports
            failedReports:
              type: integer
              description: Failed report uploads
            totalFiles:
              type: integer
              description: Total files uploaded
            successfulFiles:
              type: integer
              description: Successfully uploaded files
            failedFiles:
              type: integer
              description: Failed file uploads
            processingDetails:
              type: array
              items:
                type: object
                properties:
                  reportIndex:
                    type: integer
                    description: Report index in batch
                  status:
                    type: string
                    enum: [SUCCESS, FAILED]
                    description: Processing status
                  message:
                    type: string
                    maxLength: 512
                    description: Processing message
                  reportId:
                    type: string
                    description: Generated report ID (if successful)
              minItems: 0
              description: Detailed processing results
      required:
        - ResponseInfo
        - UploadResults

    # ========================
    # TEAM MANAGEMENT SCHEMAS
    # ========================

    TeamAssignmentSearchRequest:
      type: object
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        TeamAssignmentSearchCriteria:
          type: object
          properties:
            tenantId:
              type: string
              minLength: 1
              maxLength: 64
              description: Tenant ID
            projectIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Project IDs
            fieldPlanIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Field plan IDs
            userId:
              type: string
              minLength: 1
              maxLength: 64
              description: User ID (for specific user assignments)
            roleCodes:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: User role codes (master data)
            includeCompleted:
              type: boolean
              default: false
              description: Include completed assignments
          required:
            - tenantId
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - RequestInfo
        - TeamAssignmentSearchCriteria

    TeamAssignmentSearchResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        TeamAssignments:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                description: User ID
              userName:
                type: string
                description: User name (from HRMS)
              fieldPlanId:
                type: string
                description: Field plan ID
              fieldPlanName:
                type: string
                description: Field plan name
              projectId:
                type: string
                description: Project ID
              projectName:
                type: string
                description: Project name
              roleCode:
                type: string
                description: Assignment role code (master data)
              assignmentDate:
                type: integer
                format: int64
                description: Assignment date
              statusCode:
                type: string
                description: Assignment status (master data code)
              facilityCount:
                type: integer
                description: Number of assigned facilities
              completedActivities:
                type: integer
                description: Number of completed activities
              totalActivities:
                type: integer
                description: Total number of activities
          minItems: 0
        AssignmentSummary:
          type: object
          properties:
            totalAssignments:
              type: integer
              description: Total assignments
            activeAssignments:
              type: integer
              description: Active assignments
            completedAssignments:
              type: integer
              description: Completed assignments
      required:
        - ResponseInfo
        - TeamAssignments

tags:
