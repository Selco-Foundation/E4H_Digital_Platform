          $ref: '#/components/schemas/RequestInfo'
        FacilityActivitySearchCriteria:
          type: object
          properties:
            tenantId:
              type: string
              minLength: 1
              maxLength: 64
              description: Tenant ID
            ids:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Facility activity IDs
            facilityIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Facility IDs
            activityIds:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Activity IDs (master data)
            statuses:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
              description: Statuses (master data codes)
            assignedUserId:
              type: string
              minLength: 1
              maxLength: 64
              description: Assigned user ID
            isActive:
              type: boolean
              description: Filter by activation status
            assignedToMe:
              type: boolean
