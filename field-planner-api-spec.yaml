openapi: 3.0.3
info:
  title: E4H Field Planner API
  description: |
    API specification for the E4H Digital Platform Field Planner module.
    
    The Field Planner enables Project Managers to create and manage field plans for project execution,
    assign activities to Activity SPOCs, manage health facility assignments, and coordinate field operations
    through mobile applications.
    
    **Key Features:**
    - Bulk Field Plan Creation and Management
    - Activity Assignment within Field Plan Context
    - Health Facility to Activity Mapping
    - Mobile App Data Synchronization
    - Activity Report Management with Workflow
    - Conditional Facility Activation
    - Integration with existing E4H platform services
    
    **Integration Points:**
    - eGov HRMS for user management
    - Health Facility Registry for facility data
    - Project Service for project information
    - eGov Workflow v2 for state management
    - eGov Filestore for file operations
    - eGov MDMS v2 for master data and activity definitions
    
    **Master Data Dependencies:**
    - Activity types (MDMS)
    - Status codes (MDMS) 
    - Priority levels (MDMS)
    - Workflow states (MDMS)
    - User roles (MDMS)
  version: 1.0.0
  contact:
    name: E4H Field Planner Team
    email: support@e4h-platform.org
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.e4h-platform.org/field-planner/v1
    description: Production server
  - url: https://staging-api.e4h-platform.org/field-planner/v1
    description: Staging server
  - url: https://dev-api.e4h-platform.org/field-planner/v1
    description: Development server

security:
  - BearerAuth: []

paths:
  # ========================
  # FIELD PLAN MANAGEMENT
  # ========================
  
  /v1/field-plans/_create:
    post:
      tags:
        - Field Plans
      summary: Create field plans (bulk operation)
      description: Creates one or more field plans within projects with specified activities and facilities
      operationId: createFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldPlansRequest'
      responses:
        '201':
          description: Field plans created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/_search:
    post:
      tags:
        - Field Plans
      summary: Search field plans
      description: Search field plans with various filters and pagination
      operationId: searchFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPlanSearchRequest'
      responses:
        '200':
          description: Field plans retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlanSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/{id}:
    get:
      tags:
        - Field Plans
      summary: Get field plan by ID
      description: Retrieve a specific field plan by its ID
      operationId: getFieldPlan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Tenant ID
      responses:
        '200':
          description: Field plan retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/_update:
    post:
      tags:
        - Field Plans
      summary: Update field plans (bulk operation)
      description: Update one or more existing field plans (limited fields based on current status)
      operationId: updateFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldPlansRequest'
      responses:
        '200':
          description: Field plans updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/_workflow:
    post:
      tags:
        - Field Plans
      summary: Update field plan workflow status
      description: Update workflow status for one or more field plans
      operationId: updateFieldPlanWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPlanWorkflowRequest'
      responses:
        '200':
          description: Field plan workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facilities/_assign:
    post:
      tags:
        - Field Plans
      summary: Assign facilities to field plans (bulk operation)
      description: Assign multiple health facilities to multiple field plans in bulk
      operationId: bulkAssignFacilitiesToFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkFacilityAssignmentRequest'
      responses:
        '200':
          description: Facilities assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFacilityAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/{fieldPlanId}/facilities/template:
    get:
      tags:
        - Field Plans
      summary: Download facility assignment template
      description: Generate and download Excel template for bulk facility assignment to a specific field plan
      operationId: getFacilityTemplate
      parameters:
        - name: fieldPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Tenant ID
        - name: templateType
          in: query
          schema:
            type: string
            enum: [FACILITY_SELECTION, FACILITY_ASSIGNMENT]
            default: FACILITY_SELECTION
          description: Type of template to generate (master data code)
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
          description: Template format
      responses:
        '200':
          description: Template generated successfully
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # FIELD PLAN ACTIVITY MANAGEMENT (Activities within Field Plan Context)
  # ========================

  /v1/field-plans/{fieldPlanId}/activities/{activityId}/_assign:
    post:
      tags:
        - Field Plan Activities
      summary: Assign SPOC to activity within field plan context
      description: Assign Activity SPOC to a specific activity within a field plan context
      operationId: assignActivitySpocInFieldPlan
      parameters:
        - name: fieldPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Activity ID (from MDMS master data)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignActivitySpocRequest'
      responses:
        '200':
          description: Activity SPOC assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySpocAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/{fieldPlanId}/activities/_search:
    post:
      tags:
        - Field Plan Activities
      summary: Search activities within field plan context
      description: Search activities assigned within a specific field plan
      operationId: searchFieldPlanActivities
      parameters:
        - name: fieldPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPlanActivitySearchRequest'
      responses:
        '200':
          description: Field plan activities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlanActivitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # FACILITY ACTIVITY MAPPING (Within Field Plan Context)
  # ========================

  /v1/field-plans/{fieldPlanId}/facility-activities/_assign:
    post:
      tags:
        - Facility Activities
      summary: Assign facilities to activities within field plan (bulk operation)
      description: Map multiple facilities to multiple activities within a field plan context
      operationId: assignFacilitiesToActivitiesInFieldPlan
      parameters:
        - name: fieldPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityActivityAssignmentRequest'
      responses:
        '200':
          description: Facility activities assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityActivityAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/{fieldPlanId}/facility-activities/_update:
    post:
      tags:
        - Facility Activities
      summary: Update facility activities (bulk operation)
      description: Update facility activity mappings including activation status, user assignments, etc.
      operationId: updateFacilityActivitiesInFieldPlan
      parameters:
        - name: fieldPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacilityActivitiesRequest'
      responses:
        '200':
          description: Facility activities updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityActivitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/{fieldPlanId}/facility-activities/_search:
    post:
      tags:
        - Facility Activities
      summary: Search facility activities within field plan
      description: Search facility activity mappings within a specific field plan
      operationId: searchFacilityActivitiesInFieldPlan
      parameters:
        - name: fieldPlanId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityActivitySearchRequest'
      responses:
        '200':
          description: Facility activities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityActivitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/facility-activities/{facilityActivityId}/activation-check:
    get:
      tags:
        - Facility Activities
      summary: Check facility activity activation status
      description: Check if a facility activity can be activated based on predefined conditions
      operationId: checkFacilityActivityActivation
      parameters:
        - name: facilityActivityId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Facility activity mapping ID
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Tenant ID
      responses:
        '200':
          description: Activation status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCheckResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # ACTIVITY REPORTS
  # ========================

  /v1/activity-reports/_create:
    post:
      tags:
        - Activity Reports
      summary: Create activity reports (bulk operation)
      description: Create one or more activity reports for facility activities
      operationId: createActivityReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityReportsRequest'
      responses:
        '201':
          description: Activity reports created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/activity-reports/_search:
    post:
      tags:
        - Activity Reports
      summary: Search activity reports
      description: Search activity reports with various filters including facility ID
      operationId: searchActivityReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReportSearchRequest'
      responses:
        '200':
          description: Activity reports retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/activity-reports/_update:
    post:
      tags:
        - Activity Reports
      summary: Update activity reports (bulk operation)
      description: Update one or more existing activity reports
      operationId: updateActivityReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityReportsRequest'
      responses:
        '200':
          description: Activity reports updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/activity-reports/_workflow:
    post:
      tags:
        - Activity Reports
      summary: Update activity report workflow status
      description: Update workflow status for activity reports (submit, approve, reject, flag for QC)
      operationId: updateActivityReportWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReportWorkflowRequest'
      responses:
        '200':
          description: Activity report workflow updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # MOBILE SYNC (Leveraging existing platform APIs)
  # ========================

  /v1/mobile/sync/assignments:
    post:
      tags:
        - Mobile Sync
      summary: Sync user assignments for mobile app
      description: Get user-specific facility activity assignments for mobile app synchronization (leverages Health Facility Registry bulk APIs)
      operationId: syncUserAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAssignmentSyncRequest'
      responses:
        '200':
          description: User assignments synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAssignmentSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/mobile/reports/_upload:
    post:
      tags:
        - Mobile Sync
      summary: Upload activity reports from mobile app
      description: Upload activity reports and media files collected offline from mobile app
      operationId: uploadMobileReports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reports:
                  type: string
                  description: JSON array of activity reports collected offline
                  minLength: 1
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 0
                  description: Media files (images, videos, documents) associated with reports
                tenantId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Tenant ID
                userId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: User ID
              required:
                - reports
                - tenantId
                - userId
      responses:
        '200':
          description: Mobile reports uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileReportUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # TEAM MANAGEMENT (Using existing HRMS APIs)
  # ========================

  /v1/teams/assignments/_search:
    post:
      tags:
        - Team Management
      summary: Search team assignments across field plans
      description: Search team member assignments across field plans (leverages HRMS APIs for user data)
      operationId: searchTeamAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamAssignmentSearchRequest'
      responses:
        '200':
          description: Team assignments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAssignmentSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - resource already exists or invalid state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ========================
    # COMMON SCHEMAS (Referencing eGov platform contracts)
    # ========================
    
    RequestInfo:
      type: object
      description: Request information (from eGov common contracts) 
      externalDocs:
        url: https://github.com/egovernments/health-campaign-services/blob/develop/docs/health-api-specs/contracts/common.yaml#RequestInfo
      properties:
        apiId:
          type: string
          minLength: 1
          maxLength: 128
          description: API identifier
        ver:
          type: string
          minLength: 1
          maxLength: 32
          description: API version
        ts:
          type: integer
          format: int64
          description: Request timestamp
        action:
          type: string
          minLength: 1
          maxLength: 64
          description: Action being performed
        did:
          type: string
          maxLength: 64
          description: Device ID
        key:
          type: string
          maxLength: 256
          description: API key
        msgId:
          type: string
          minLength: 1
          maxLength: 256
          description: Message ID
        authToken:
          type: string
          maxLength: 2048
          description: Authentication token
        userInfo:
          $ref: '#/components/schemas/UserInfo'
      required:
        - apiId
        - ver
        - ts
        - action

    ResponseInfo:
      type: object
      description: Response information (from eGov common contracts)
      externalDocs:
        url: https://github.com/egovernments/health-campaign-services/blob/develop/docs/health-api-specs/contracts/common.yaml#ResponseInfo
      properties:
        apiId:
          type: string
          minLength: 1
          maxLength: 128
          description: API identifier
        ver:
          type: string
          minLength: 1
          maxLength: 32
          description: API version
        ts:
          type: integer
          format: int64
          description: Response timestamp
        resMsgId:
          type: string
          maxLength: 256
          description: Response message ID
        msgId:
          type: string
          maxLength: 256
          description: Request message ID
        status:
          type: string
          enum: [SUCCESSFUL, FAILED]
          description: Response status
        error:
          $ref: '#/components/schemas/Error'
      required:
        - apiId
        - ver
        - ts
        - status

    UserInfo:
      type: object
      description: User information (from eGov common contracts)
      externalDocs:
        url: https://github.com/egovernments/health-campaign-services/blob/develop/docs/health-api-specs/contracts/common.yaml#UserInfo
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: User ID
        userName:
          type: string
          minLength: 1
          maxLength: 128
          description: Username
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Full name
        type:
          type: string
          minLength: 1
          maxLength: 64
          description: User type (master data code)
        mobileNumber:
          type: string
          pattern: '^[0-9]{10,15}$'
          description: Mobile number
        emailId:
          type: string
          format: email
          maxLength: 256
          description: Email ID
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          minItems: 1
          description: User roles
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID

    Role:
      type: object
      description: User role (from eGov common contracts)
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Role ID
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Role name
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Role code (master data code)
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID

    Error:
      type: object
      description: Error details (from eGov common contracts)
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Error code
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Error message
        description:
          type: string
          maxLength: 1024
          description: Error description
        params:
          type: array
          items:
            type: object
          description: Error parameters

    ErrorResponse:
      type: object
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
      required:
        - ResponseInfo

    Pagination:
      type: object
      description: Pagination parameters (from eGov common contracts)
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Number of records per page
        offset:
          type: integer
          minimum: 0
          default: 0
          description: Number of records to skip
