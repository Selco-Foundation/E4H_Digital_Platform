openapi: 3.0.3
info:
  title: E4H Field Planner API
  description: |
    API specification for the E4H Digital Platform Field Planner module.
    
    The Field Planner enables Project Managers to create and manage field plans for project execution,
    assign activities to Activity SPOCs, manage health facility assignments, and coordinate field operations
    through mobile applications.
    
    **Key Features:**
    - Bulk Field Plan Creation and Management
    - Activity Assignment within Field Plan Context
    - Health Facility to Activity Mapping
    - Mobile App Data Synchronization
    - Activity Report Management with Workflow
    - Conditional Facility Activation
    - Integration with existing E4H platform services
    
    **Integration Points:**
    - eGov HRMS for user management
    - Health Facility Registry for facility data
    - Project Service for project information
    - eGov Workflow v2 for state management
    - eGov Filestore for file operations
    - eGov MDMS v2 for master data and activity definitions
    
    **Master Data Dependencies:**
    - Activity types (MDMS)
    - Status codes (MDMS) 
    - Priority levels (MDMS)
    - Workflow states (MDMS)
    - User roles (MDMS)
    
    **API Patterns:**
    - All endpoints use /v1/ versioning
    - Bulk operations accept arrays for efficiency
    - Unified _workflow endpoints for state transitions
    - Context-based URLs (e.g., field-plans/{id}/activities/{id}/_assign)
    - Mobile sync optimized for offline-first operations
  version: 1.0.0
  contact:
    name: E4H Field Planner Team
    email: support@e4h-platform.org
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.e4h-platform.org/field-planner
    description: Production server
  - url: https://staging-api.e4h-platform.org/field-planner
    description: Staging server
  - url: https://dev-api.e4h-platform.org/field-planner
    description: Development server

security:
  - BearerAuth: []

paths:
  # ========================
  # FIELD PLAN MANAGEMENT
  # ========================
  
  /v1/field-plans/_create:
    post:
      tags:
        - Field Plans
      summary: Create field plans (bulk operation)
      description: |
        Creates one or more field plans within projects with specified activities and facilities.
        Accepts an array of field plans for bulk creation.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - PROJECT_MANAGER: Can create field plans for their projects
        
        **Business Rules:**
        - Field plan name must be unique within project
        - Start date must be before end date
        - At least one activity must be specified
        - Facilities must be within project boundaries
      operationId: createFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldPlansRequest'
      responses:
        '201':
          description: Field plans created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/_search:
    post:
      tags:
        - Field Plans
      summary: Search field plans
      description: |
        Search field plans with various filters and pagination.
        
        **Access Control:**
        - All roles can search field plans
        - Results filtered based on user role and scope
        
        **Filtering:**
        - PROJECT_MANAGER: Sees field plans in their projects
        - Activity SPOCs: See field plans with their activities
        - Field Staff: See field plans with their assignments
      operationId: searchFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPlanSearchRequest'
      responses:
        '200':
          description: Field plans retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlanSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/_update:
    post:
      tags:
        - Field Plans
      summary: Update field plans (bulk operation)
      description: |
        Updates one or more field plans. Accepts array of field plans for bulk updates.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - PROJECT_MANAGER: Can update field plans in their projects
        
        **Business Rules:**
        - Cannot update field plans with irreversible actions
        - End date can be modified if no activities are in progress
        - Facilities can be added/removed if not yet active
      operationId: updateFieldPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFieldPlansRequest'
      responses:
        '200':
          description: Field plans updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/_workflow:
    post:
      tags:
        - Field Plans
      summary: Field plan workflow transitions
      description: |
        Unified endpoint for all field plan workflow state transitions.
        
        **Actions:**
        - SUBMIT: Submit field plan for approval
        - APPROVE: Approve field plan
        - REJECT: Reject field plan with comments
        - ACTIVATE: Activate field plan for execution
        - COMPLETE: Mark field plan as completed
        - CANCELLED: Cancel field plan
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: All actions
        - PROJECT_MANAGER: SUBMIT, ACTIVATE, COMPLETE, CANCELLED
      operationId: fieldPlanWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPlanWorkflowRequest'
      responses:
        '200':
          description: Workflow transition successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPlanWorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facilities/_assign:
    post:
      tags:
        - Field Plans
      summary: Assign facilities to field plans
      description: |
        Assign health facilities to field plans with activity scheduling.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - PROJECT_MANAGER: Can assign facilities to their field plans
        
        **Business Rules:**
        - Facilities must be within project boundaries
        - Activities must be valid for the field plan
        - Cannot assign facilities already assigned to active activities
      operationId: assignFacilitiesToFieldPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityAssignmentRequest'
      responses:
        '200':
          description: Facilities assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facilities/_template:
    get:
      tags:
        - Field Plans
      summary: Download facility selection template
      description: |
        Download an Excel template pre-populated with project facilities for selection (Yes/No) as part of field plan creation.
        Filters like districts and activities can be applied to narrow the facility list.
      operationId: downloadFacilityTemplate
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Project ID for which facilities are listed
        - name: districtCodes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 64
          style: form
          explode: true
          description: Optional district codes to filter facilities
        - name: activityTypes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [INSTALLATION, FIELD_QC, HANDOVER, ASSESSMENT]
          style: form
          explode: true
          description: Optional activity types to include in template context
      responses:
        '200':
          description: Template generated successfully
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggested filename for download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facilities/_upload:
    post:
      tags:
        - Field Plans
      summary: Upload facility selection sheet
      description: |
        Upload the completed facility selection Excel to set facilities Yes/No for inclusion in a field plan.
        Returns a row-wise summary with errors, if any.
      operationId: uploadFacilitySelection
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                RequestInfo:
                  $ref: '#/components/schemas/RequestInfo'
                projectId:
                  type: string
                  minLength: 1
                  maxLength: 64
                file:
                  type: string
                  format: binary
                  description: Excel file as per downloaded template
              required:
                - RequestInfo
                - projectId
                - file
      responses:
        '200':
          description: Upload processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload too large
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # ACTIVITY MANAGEMENT
  # ========================
  
  /v1/field-plans/activities/_assign:
    post:
      tags:
        - Activities
      summary: Assign activities to SPOCs
      description: |
        Assign activities within a field plan to Activity SPOCs.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - PROJECT_MANAGER: Can assign activities in their field plans
        - Activity SPOCs: Can assign activities of their type
        
        **Business Rules:**
        - SPOC must have appropriate role for activity type
        - Cannot assign activities already assigned
        - Assignment triggers notification to SPOC
      operationId: assignActivitiesToSPOC
      parameters:
        - name: fieldPlanId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityAssignmentRequest'
      responses:
        '200':
          description: Activities assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facility-activities/_assign:
    post:
      tags:
        - Activities
      summary: Assign facilities to field staff
      description: |
        Assign specific health facilities to field staff for activity execution.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - PROJECT_MANAGER: Can assign facilities in their field plans
        - Activity SPOCs: Can assign facilities for their activities
        
        **Business Rules:**
        - Facility must be scheduled for the activity
        - Field staff must be available and qualified
        - Assignment triggers mobile sync notification
      operationId: assignFacilitiesToStaff
      parameters:
        - name: fieldPlanId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityActivityAssignmentRequest'
      responses:
        '200':
          description: Facilities assigned to staff successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityActivityAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facility-activities/_search:
    post:
      tags:
        - Activities
      summary: Search facility activities
      description: |
        Search facility activities within a field plan with various filters.
        
        **Access Control:**
        - All roles can search facility activities
        - Results filtered based on user role and assignments
        
        **Filtering:**
        - Activity SPOCs: See activities of their type
        - Field Staff: See their assigned facilities
        - Reviewers: See activities requiring their review
      operationId: searchFacilityActivities
      parameters:
        - name: fieldPlanId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Optional field plan ID filter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityActivitySearchRequest'
      responses:
        '200':
          description: Facility activities retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityActivitySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/field-plans/facility-activities/_update:
    post:
      tags:
        - Activities
      summary: Update facility activities
      description: |
        Update facility activity assignments and status.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - PROJECT_MANAGER: Can update activities in their field plans
        - Activity SPOCs: Can update activities of their type
        
        **Business Rules:**
        - Cannot update activities in progress or completed
        - Status changes trigger workflow transitions
        - Updates sync to mobile applications
      operationId: updateFacilityActivities
      parameters:
        - name: fieldPlanId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityActivityUpdateRequest'
      responses:
        '200':
          description: Facility activities updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityActivityUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # ACTIVITY REPORTS
  # ========================
  
  /v1/activity-reports/_create:
    post:
      tags:
        - Activity Reports
      summary: Create activity reports (bulk operation)
      description: |
        Create activity reports for completed field work.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - FIELD_STAFF: Can create reports for their assignments
        
        **Business Rules:**
        - Report must be for assigned facility and activity
        - Required attachments must be included
        - Report triggers workflow for review
      operationId: createActivityReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityReportsRequest'
      responses:
        '201':
          description: Activity reports created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/activity-reports/_update:
    post:
      tags:
        - Activity Reports
      summary: Update activity reports (bulk operation)
      description: |
        Update activity reports. Only allowed for DRAFT or REJECTED reports.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - FIELD_STAFF: Can update their own reports in DRAFT/REJECTED status
        
        **Business Rules:**
        - Cannot update approved or in-review reports
        - Updates trigger re-submission workflow
      operationId: updateActivityReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityReportsRequest'
      responses:
        '200':
          description: Activity reports updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/activity-reports/_search:
    post:
      tags:
        - Activity Reports
      summary: Search activity reports
      description: |
        Search activity reports with various filters and pagination.
        
        **Access Control:**
        - All roles can search activity reports
        - Results filtered based on user role and scope
        
        **Filtering:**
        - Reviewers: See reports requiring their review
        - Activity SPOCs: See reports for their activities
        - Field Staff: See their own reports
      operationId: searchActivityReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReportSearchRequest'
      responses:
        '200':
          description: Activity reports retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/activity-reports/_workflow:
    post:
      tags:
        - Activity Reports
      summary: Activity report workflow transitions
      description: |
        Unified endpoint for all activity report workflow state transitions.
        
        **Actions:**
        - SUBMIT: Submit report for review
        - APPROVE: Approve report
        - REJECT: Reject report with comments
        - FLAG_FOR_QC: Flag report for quality control
        - RESUBMIT: Re-submit rejected report
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: All actions
        - Reviewers: APPROVE, REJECT, FLAG_FOR_QC for their activity type
        - FIELD_STAFF: SUBMIT, RESUBMIT for their reports
      operationId: activityReportWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReportWorkflowRequest'
      responses:
        '200':
          description: Workflow transition successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityReportWorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # MOBILE SYNCHRONIZATION
  # ========================
  
  /v1/mobile/sync/assignments/_bulk:
    post:
      tags:
        - Mobile Sync
      summary: Bulk sync field assignments
      description: |
        Synchronize field assignments for mobile applications.
        Optimized for offline-first mobile operations.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - FIELD_STAFF: Can sync their own assignments
        
        **Features:**
        - Differential sync based on last sync timestamp
        - Bulk data transfer for efficiency
        - Conflict resolution (server-wins strategy)
        - Offline data preparation
      operationId: bulkSyncAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileSyncRequest'
      responses:
        '200':
          description: Assignments synced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/mobile/reports/_bulk_upload:
    post:
      tags:
        - Mobile Sync
      summary: Bulk upload activity reports
      description: |
        Upload multiple activity reports with attachments from mobile applications.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - FIELD_STAFF: Can upload their own reports
        
        **Features:**
        - Multipart form data for files
        - Bulk report processing
        - Attachment validation
        - Offline queue processing
      operationId: bulkUploadReports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                RequestInfo:
                  $ref: '#/components/schemas/RequestInfo'
                ActivityReports:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityReport'
                  minItems: 1
                  maxItems: 50
                Files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Report attachments
      responses:
        '200':
          description: Reports uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload too large
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/mobile/masterdata/_sync:
    post:
      tags:
        - Mobile Sync
      summary: Sync master data for mobile
      description: |
        Synchronize master data required for mobile applications.
        
        **Access Control:**
        - FIELD_PLANNER_ADMIN: Full access
        - FIELD_STAFF: Can sync master data
        
        **Data Types:**
        - Activity types and statuses
        - Document types and requirements
        - Workflow configurations
        - Validation rules
      operationId: syncMasterData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataSyncRequest'
      responses:
        '200':
          description: Master data synced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterDataSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========================
  # TEAM MANAGEMENT
  # ========================
  
  /v1/teams/assignments/_search:
    post:
      tags:
        - Team Management
      summary: Search team assignments
      description: |
        Search team assignments and organizational structure.
        Integrates with eGov HRMS for user management.
        
        **Access Control:**
        - All roles can search team assignments
        - Results filtered based on user role and scope
        
        **Integration:**
        - Uses eGov HRMS supervisor-employee relationships
        - No custom team creation within Field Planner
        - Leverages existing organizational hierarchy
      operationId: searchTeamAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamAssignmentSearchRequest'
      responses:
        '200':
          description: Team assignments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamAssignmentSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - resource already exists or invalid state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ========================
    # COMMON SCHEMAS (Referencing eGov platform contracts)
    # ========================
    
    RequestInfo:
      type: object
      description: Request information (from eGov common contracts) 
      externalDocs:
        url: https://github.com/egovernments/health-campaign-services/blob/develop/docs/health-api-specs/contracts/common.yaml#RequestInfo
      properties:
        apiId:
          type: string
          minLength: 1
          maxLength: 128
          description: API identifier
        ver:
          type: string
          minLength: 1
          maxLength: 32
          description: API version
        ts:
          type: integer
          format: int64
          description: Request timestamp
        action:
          type: string
          minLength: 1
          maxLength: 64
          description: Action being performed
        did:
          type: string
          maxLength: 64
          description: Device ID
        key:
          type: string
          maxLength: 256
          description: API key
        msgId:
          type: string
          minLength: 1
          maxLength: 256
          description: Message ID
        authToken:
          type: string
          maxLength: 2048
          description: Authentication token
        userInfo:
          $ref: '#/components/schemas/UserInfo'
      required:
        - apiId
        - ver
        - ts
        - action

    ResponseInfo:
      type: object
      description: Response information (from eGov common contracts)
      externalDocs:
        url: https://github.com/egovernments/health-campaign-services/blob/develop/docs/health-api-specs/contracts/common.yaml#ResponseInfo
      properties:
        apiId:
          type: string
          minLength: 1
          maxLength: 128
          description: API identifier
        ver:
          type: string
          minLength: 1
          maxLength: 32
          description: API version
        ts:
          type: integer
          format: int64
          description: Response timestamp
        resMsgId:
          type: string
          minLength: 1
          maxLength: 256
          description: Response message ID
        msgId:
          type: string
          minLength: 1
          maxLength: 256
          description: Request message ID
        status:
          type: string
          enum: [successful, failed]
          description: Response status
      required:
        - apiId
        - ver
        - ts
        - resMsgId
        - msgId
        - status

    UserInfo:
      type: object
      description: User information (from eGov common contracts)
      externalDocs:
        url: https://github.com/egovernments/health-campaign-services/blob/develop/docs/health-api-specs/contracts/common.yaml#UserInfo
      properties:
        id:
          type: integer
          description: User ID
        uuid:
          type: string
          format: uuid
          description: User UUID
        userName:
          type: string
          minLength: 1
          maxLength: 64
          description: Username
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Full name
        mobileNumber:
          type: string
          minLength: 10
          maxLength: 15
          description: Mobile number
        emailId:
          type: string
          format: email
          maxLength: 128
          description: Email address
        locale:
          type: string
          maxLength: 10
          description: Locale
        type:
          type: string
          maxLength: 32
          description: User type
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: User roles
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID
      required:
        - id
        - uuid
        - userName
        - name
        - tenantId

    Role:
      type: object
      description: User role information
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Role name
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Role code
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID

    AuditDetails:
      type: object
      description: Audit information for all entities
      properties:
        createdBy:
          type: string
          minLength: 1
          maxLength: 64
          description: User who created the record
        createdTime:
          type: integer
          format: int64
          description: Creation timestamp
        lastModifiedBy:
          type: string
          minLength: 1
          maxLength: 64
          description: User who last modified the record
        lastModifiedTime:
          type: integer
          format: int64
          description: Last modification timestamp
      required:
        - createdBy
        - createdTime

    ErrorResponse:
      type: object
      description: Standard error response format
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        Errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: List of errors
      required:
        - ResponseInfo
        - Errors

    Error:
      type: object
      description: Individual error details
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: Error code
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Error message
        description:
          type: string
          maxLength: 1024
          description: Detailed error description
        fieldName:
          type: string
          maxLength: 128
          description: Field name causing the error
        params:
          type: array
          items:
            type: string
          description: Additional error parameters
      required:
        - code
        - message

    FacilityUploadResponse:
      type: object
      description: Response for facility selection upload
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        Summary:
          type: object
          properties:
            totalRows:
              type: integer
              minimum: 0
            successCount:
              type: integer
              minimum: 0
            errorCount:
              type: integer
              minimum: 0
          required:
            - totalRows
            - successCount
            - errorCount
        RowResults:
          type: array
          description: Row-wise processing results
          items:
            type: object
            properties:
              rowNumber:
                type: integer
                minimum: 1
              facilityId:
                type: string
                maxLength: 64
              selected:
                type: boolean
                description: Whether facility marked Yes for inclusion
              status:
                type: string
                enum: [successful, failed]
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
        InvalidFile:
          type: boolean
          description: True if file format/template is invalid
      required:
        - ResponseInfo
        - Summary

    # ========================
    # FIELD PLAN SCHEMAS
    # ========================

    CreateFieldPlansRequest:
      type: object
      description: Request to create field plans
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        FieldPlans:
          type: array
          items:
            $ref: '#/components/schemas/FieldPlan'
          minItems: 1
          maxItems: 100
          description: Array of field plans to create
      required:
        - RequestInfo
        - FieldPlans

    UpdateFieldPlansRequest:
      type: object
      description: Request to update field plans
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        FieldPlans:
          type: array
          items:
            $ref: '#/components/schemas/FieldPlan'
          minItems: 1
          maxItems: 100
          description: Array of field plans to update
      required:
        - RequestInfo
        - FieldPlans

    FieldPlanSearchRequest:
      type: object
      description: Request to search field plans
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        SearchCriteria:
          $ref: '#/components/schemas/FieldPlanSearchCriteria'
        Pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - RequestInfo
        - SearchCriteria

    FieldPlanSearchCriteria:
      type: object
      description: Criteria for field plan search
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          description: Tenant ID
        ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Field plan IDs
        projectIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Project IDs
        statuses:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Statuses (MDMS codes)
        createdBy:
          type: string
          minLength: 1
          maxLength: 64
          description: Created by user ID
        fromDate:
          type: integer
          format: int64
          description: Filter from date
        toDate:
          type: integer
          format: int64
          description: Filter to date
        assignedToMe:
          type: boolean
          description: Filter for field plans assigned to current user
      required:
        - tenantId

    FieldPlansResponse:
      type: object
      description: Response for field plans operations
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        FieldPlans:
          type: array
          items:
            $ref: '#/components/schemas/FieldPlan'
          description: Array of field plans
      required:
        - ResponseInfo
        - FieldPlans

    FieldPlanSearchResponse:
      type: object
      description: Response for field plan search
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        FieldPlans:
          type: array
          items:
            $ref: '#/components/schemas/FieldPlan'
          description: Array of field plans
        TotalCount:
          type: integer
          description: Total number of field plans
      required:
        - ResponseInfo
        - FieldPlans

    FieldPlanWorkflowRequest:
      type: object
      description: Request for field plan workflow transitions
      properties:
        RequestInfo:
          $ref: '#/components/schemas/RequestInfo'
        WorkflowRequests:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRequest'
          minItems: 1
          maxItems: 50
          description: Array of workflow requests
      required:
        - RequestInfo
        - WorkflowRequests

    WorkflowRequest:
      type: object
      description: Individual workflow transition request
      properties:
        businessObjectId:
          type: string
          minLength: 1
          maxLength: 64
          description: Field plan ID
        action:
          type: string
          enum: [SUBMIT, APPROVE, REJECT, ACTIVATE, COMPLETE, CANCELLED]
          description: Workflow action
        comment:
          type: string
          maxLength: 1000
          description: Optional comment for the action
        assignee:
          type: string
          maxLength: 64
          description: Assignee for the action
      required:
        - businessObjectId
        - action

    FieldPlanWorkflowResponse:
      type: object
      description: Response for field plan workflow transitions
      properties:
        ResponseInfo:
          $ref: '#/components/schemas/ResponseInfo'
        WorkflowResponses:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowResponse'
          description: Array of workflow responses
      required:
        - ResponseInfo
        - WorkflowResponses

    WorkflowResponse:
      type: object
      description: Individual workflow transition response
      properties:
        businessObjectId:
          type: string
          minLength: 1
          maxLength: 64
          description: Field plan ID
        status:
          type: string
          enum: [successful, failed]
          description: Workflow transition status
        currentState:
          type: string
          minLength: 1
          maxLength: 64
          description: Current workflow state
        error:
          $ref: '#/components/schemas/Error'
          description: Error details if failed
      required:
        - businessObjectId
        - status
        - currentState

    # ========================
