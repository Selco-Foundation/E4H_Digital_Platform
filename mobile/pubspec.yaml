name: selco
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <=4.0.0'

dependencies:
  flutter:
    sdk: flutter

  auto_route: ^8.3.0
  badges: ^3.1.2
  collection: ^1.18.0
  connectivity_plus: ^6.0.3
  cupertino_icons: ^1.0.8
  dart_mappable: ^4.2.2
  digit_data_model: ^1.0.6
  digit_dss: ^1.0.4
  digit_ui_components: 0.2.2+9
  dio: ^5.4.3+1
  disable_battery_optimization: ^1.1.1
  drift: ^2.18.0
  drift_db_viewer: ^2.1.0
  flutter_bloc: ^8.1.5
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  recase: ^4.1.0
  flutter_keyboard_visibility: ^5.4.1
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^8.2.8
  flutter_secure_storage: ^9.2.2
  flutter_background_service: ^5.0.5
  intl: ^0.19.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  location: ^6.0.2
  pretty_dio_logger: ^1.3.1
  package_info_plus: ^8.0.0
  reactive_forms: ^17.0.0
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0
  open_file: ^3.5.4
  permission_handler: ^11.3.1
  video_player: ^2.9.5
  flutter_pdfview: ^1.4.1+1
  internet_connection_checker_plus: ^2.7.2
  digit_scanner: ^1.0.6+4
  digit_forms_engine: 0.0.9-dev
  flutter_local_notifications: ^19.5.0

dependency_overrides:
  camera_android_camerax: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  auto_route_generator: ^8.0.0
  build_runner: ^2.4.11
  dart_mappable_builder:
    git:
      url: https://github.com/egovernments/health-campaign-field-worker-app/
      ref: master
      path: ./packages/dart_mappable_builder
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0
  freezed: ^2.5.2
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  patch_package: ^0.0.8

flutter:
  assets:
    - ./
    - .env
    - assets/icons/svg/
    - assets/animated_json/
    - assets/images/
    - assets/mocks/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/Roboto/RobotoCondensed-Regular.ttf
  uses-material-design: true