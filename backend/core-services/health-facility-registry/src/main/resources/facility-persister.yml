serviceMaps:
  serviceName: facility-service
  mappings:
    - version: 1.0
      description: Persists a single Facility object
      fromTopic: save-facility
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO facility (
              facility_id, tenant_id, facility_name, facility_type,
              facility_category, facility_ownership, facility_region,
              facility_details, address, wf_status, additional_details,
              is_active, boundary_code
            )
            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $
          jsonMaps:
            - jsonPath: $.facility_id
            - jsonPath: $.tenant_id
            - jsonPath: $.facility_name
            - jsonPath: $.facility_type
            - jsonPath: $.facility_category
            - jsonPath: $.facility_ownership
            - jsonPath: $.facility_region
            - jsonPath: $.facility_details
              type: JSON
              dbType: JSONB
            - jsonPath: $.address
              type: JSON
              dbType: JSONB
            - jsonPath: $.wfStatus
            - jsonPath: $.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.isActive
            - jsonPath: $.boundaryCode

    - version: 1.0
      description: Updates a single Facility object
      fromTopic: update-facility
      isTransaction: true
      queryMaps:
        - query: >
            UPDATE facility SET
              facility_name = ?, facility_type = ?, facility_category = ?,
              facility_ownership = ?, facility_region = ?, facility_details = ?,
              address = ?, wf_status = ?, additional_details = ?, is_active = ?,
              boundary_code = ?
            WHERE facility_id = ? AND tenant_id = ?;
          basePath: $
          jsonMaps:
            - jsonPath: $.facility_name
            - jsonPath: $.facility_type
            - jsonPath: $.facility_category
            - jsonPath: $.facility_ownership
            - jsonPath: $.facility_region
            - jsonPath: $.facility_details
              type: JSON
              dbType: JSONB
            - jsonPath: $.address
              type: JSON
              dbType: JSONB
            - jsonPath: $.wfStatus
            - jsonPath: $.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.isActive
            - jsonPath: $.boundaryCode
            - jsonPath: $.facility_id
            - jsonPath: $.tenant_id
