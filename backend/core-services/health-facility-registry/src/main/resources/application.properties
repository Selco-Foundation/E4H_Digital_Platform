#mdms urls
egov.mdms.host=http://localhost:8094
egov.mdms.search.endpoint=/egov-mdms-service/v1/_search

#hrms urls
egov.hrms.host=https://dev.digit.org
egov.hrms.search.endpoint=/egov-hrms/employees/_search
egov.hrms.create.endpoint=/egov-hrms/employees/_create
egov.hrms.default.department.code=DEPT_1

#User config
egov.user.host=https://dev.digit.org
egov.user.context.path=/user/users
egov.user.create.path=/_createnovalidate
egov.user.search.path=/user/_search
egov.user.update.path=/_updatenovalidate

#Idgen Config
egov.idgen.host=http://localhost:8288/
egov.idgen.path=egov-idgen/id/_generate

#Workflow config
is.workflow.enabled=false
egov.workflow.host=https://dev.digit.org
egov.workflow.transition.path=/egov-workflow-v2/egov-wf/process/_transition
egov.workflow.businessservice.search.path=/egov-workflow-v2/egov-wf/businessservice/_search
egov.workflow.processinstance.search.path=/egov-workflow-v2/egov-wf/process/_search

#url shortner
egov.url.shortner.host=https://dev.digit.org
egov.url.shortner.endpoint=/egov-url-shortening/shortener

egov.sms.notification.topic=egov.core.notification.sms
kafka.topics.receipt.create=dss-collection
# Kafka Topic
facility.create.topic=save-facility
facility.update.topic=update-facility
management.endpoints.web.exposure.include=*

kafka.topics.health.facility.kibana=save-phc-master-list-indexer

#elasticSearch index api
egov.infra.indexer.host=https://localhost:9200/
egov.infra.indexer.name=/egov-indexer/index

# Boundary service host and path
egov.boundary.host=http://localhost:8082
egov.boundary.path=/boundary-service/boundary/_search
egov.boundary.create.path=/boundary-service/boundary/_create
egov.boundary.relationship.create.path=/boundary-service/boundary-relationships/_create
egov.boundary.relationship.search.path=/boundary-service/boundary-relationships/_search

