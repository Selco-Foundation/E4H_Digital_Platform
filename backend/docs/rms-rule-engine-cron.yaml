apiVersion: batch/v1
kind: CronJob
metadata:
  name: rms-rule-engine-cron
  labels:
    app: rms-service
    job-type: rule-engine
spec:
  # Every 15 minutes
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rms-rule-engine-runner
              image: python:3.11-slim
              imagePullPolicy: IfNotPresent
              env:
                - name: RMS_BASE_URL
                  value: "http://rms-service:8885"
              command:
                - "python"
                - "/scripts/run_rms_rule_engine.py"
              volumeMounts:
                - name: rms-cron-scripts
                  mountPath: /scripts
          volumes:
            - name: rms-cron-scripts
              configMap:
                name: rms-cron-scripts
                # The ConfigMap should contain run_rms_rule_engine.py
                # as a key with the script content


