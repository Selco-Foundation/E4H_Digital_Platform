spring.application.name=processor-services
server.servlet.context-path=/processor-services
server.port=8099

# KAFKA SERVER CONFIGURATIONS
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=egov-im-services
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# KAFKA CONSUMER CONFIGURATIONS
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Enhanced Kafka Consumer Resilience Settings - Optimized for Video Processing
spring.kafka.consumer.heartbeat-interval=10000
spring.kafka.consumer.max-poll-interval-ms=1800000
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.fetch-min-size=1
spring.kafka.consumer.fetch-max-wait=500ms

# Kafka Health Check Configuration
management.health.kafka.enabled=true
spring.kafka.admin.fail-fast=false

im.kafka.process.video.topic=process-im-video-request

# TELEMETRY
otel.traces.exporter=otlp
otel.service.name=processor-services
otel.logs.exporter=none
otel.metrics.exporter=none
otel.exporter.otlp.endpoint=http://jaeger-collector.tracing:4318
otel.exporter.otlp.protocol=http/protobuf
otel.instrumentation.kafka.enabled=true
otel.instrumentation.kafka.experimental-span-attributes=true
otel.instrumentation.http.server.ignore-urls=/processor-services/health,/processor-services/prometheus

#filestore urls
egov.filestore.host=http://localhost:8083
egov.filestore.upload.endpoint=/filestore/v1/files
egov.filestore.hls.upload.endpoint=/filestore/v1/files/hls

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

ffprobe.path=/usr/bin/ffprobe
