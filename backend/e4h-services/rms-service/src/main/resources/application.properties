# IM Service Configuration
im.service.base.url=http://localhost:8880
im.service.create.endpoint=/im-services/v2/request/_create
im.service.request.timeout=30000

# Scheduler Configuration
rms.scheduler.data.collector.enabled=true
rms.scheduler.data.collector.cron=0 */15 * * * *
rms.scheduler.rule.engine.enabled=true
rms.scheduler.rule.engine.cron=0 */15 * * * *
rms.scheduler.solar.daily.enabled=true
rms.scheduler.solar.daily.cron=0 0 1 * * *

# Rule Engine Configuration
rms.rule.solar.threshold.percent=10
rms.rule.inverter.no.signal.days=2
rms.rule.inverter.high.voltage.threshold=250
rms.rule.battery.voltage.zero.enabled=true
rms.rule.grid.voltage.low.threshold=200
rms.rule.grid.voltage.high.threshold=250

# Deduplication Configuration
rms.deduplication.suppression.window.hours=24
rms.deduplication.active.alerts.cleanup.cron=0 0 2 * * *

# Center ID to HFR ID Mapping Configuration
rms.mapping.sync.enabled=true
rms.mapping.sync.cron=0 0 2 * * 0
rms.mapping.validation.days=7
rms.mapping.validation.cron=0 0 3 * * 0

# Facility Registry Configuration
facility.service.base.url=http://localhost:8082
facility.service.search.endpoint=/facility-service/v2/facility/search

# User Service Configuration (for system user)
egov.user.host=http://localhost:8281
egov.user.context.path=/user/users
egov.user.search.path=/user/_search
egov.internal.microservice.user.uuid=d2a12218-c71b-4aa3-b7e4-a811c522ef0c

# Default Tenant
rms.default.tenant.id=pg

# Testing Configuration - Limit number of tickets created per trigger (set to -1 for unlimited)
rms.testing.max.tickets.per.trigger=-1

# Logging
logging.level.org.egov.rms=INFO
logging.level.org.springframework.web=INFO

management.endpoints.web.base-path=/
management.endpoint.health.show-details=always

spring.main.allow-circular-references=true
