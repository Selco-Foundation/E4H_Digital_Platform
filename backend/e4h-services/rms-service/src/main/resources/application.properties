server.contextPath=/rms-service
server.context-path=/rms-service
server.servlet.context-path=/rms-service
server.port=8885
app.timezone=Asia/Kolkata

# Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=postgres

flyway.url=jdbc:postgresql://localhost:5432/mydb
flyway.user=postgres
flyway.password=postgres
flyway.table=public
flyway.baseline-on-migrate=true
flyway.outOfOrder=true
flyway.locations=classpath:/db/migration/main
flyway.enabled=true

# RMS API Configuration
rms.api.base.url=https://selco.theiox.com
rms.api.access.token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpZCI6MTAwMiwidXNlcl9pZCI6InVzZXJfMTAwMDIiLCJzaXRlX2lkIjoiaW5kdXN0cnlfMzQzIiwiY2xpZW50X2lkIjoiY2xpZW50XzIwNyIsImV4cCI6MjU5NzY5NjMzOH0.0VyQMHQl5sbPs2bSXPqijeJXFrUvM57Y0J_CkbdrOeI
rms.api.center.details.endpoint=/selco/center_details/graph
rms.api.center.datas.endpoint=/selco/cachedData/centerDatas/get
rms.api.timeout=30000
rms.api.retry.max.attempts=3
rms.api.retry.backoff.delay=1000

# IM Service Configuration
im.service.base.url=http://localhost:8880
im.service.create.endpoint=/im-services/v2/request/_create
im.service.request.timeout=30000

# Scheduler Configuration
rms.scheduler.data.collector.enabled=true
rms.scheduler.data.collector.cron=0 */15 * * * *
rms.scheduler.rule.engine.enabled=true
rms.scheduler.rule.engine.cron=0 */15 * * * *
rms.scheduler.solar.daily.enabled=true
rms.scheduler.solar.daily.cron=0 0 1 * * *

# Rule Engine Configuration
rms.rule.solar.threshold.percent=10
rms.rule.inverter.no.signal.days=2
rms.rule.inverter.high.voltage.threshold=250
rms.rule.battery.voltage.zero.enabled=true
rms.rule.grid.voltage.low.threshold=200
rms.rule.grid.voltage.high.threshold=250

# Deduplication Configuration
rms.deduplication.suppression.window.hours=24
rms.deduplication.active.alerts.cleanup.cron=0 0 2 * * *

# Facility Registry Configuration
facility.service.base.url=http://localhost:8080
facility.service.search.endpoint=/health-facility-registry/v1/facility/_search

# User Service Configuration (for system user)
egov.user.host=http://localhost:8281
egov.user.context.path=/user/users
egov.user.search.path=/user/_search
egov.internal.microservice.user.uuid=4fef6612-07a8-4751-97e9-0e0ac0687ebe

# Default Tenant
rms.default.tenant.id=pg

# Logging
logging.level.org.egov.rms=INFO
logging.level.org.springframework.web=INFO

management.endpoints.web.base-path=/
management.endpoint.health.show-details=always

spring.main.allow-circular-references=true

