# Test Configuration for RMS Service

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for tests
flyway.enabled=false

# Mock RMS API (use WireMock or MockServer)
rms.api.base.url=http://localhost:8089
rms.api.access.token=test-token
rms.api.center.details.endpoint=/selco/center_details/graph
rms.api.center.datas.endpoint=/selco/cachedData/centerDatas/get

# Mock IM Service
im.service.base.url=http://localhost:8090
im.service.create.endpoint=/im-services/v2/request/_create

# Mock Facility Service
facility.service.base.url=http://localhost:8091
facility.service.search.endpoint=/health-facility-registry/v1/facility/_search

# Disable schedulers in tests
rms.scheduler.data.collector.enabled=false
rms.scheduler.rule.engine.enabled=false
rms.scheduler.solar.daily.enabled=false

# Test rule thresholds
rms.rule.solar.threshold.percent=10
rms.rule.inverter.no.signal.days=2
rms.rule.inverter.high.voltage.threshold=250
rms.rule.grid.voltage.low.threshold=200
rms.rule.grid.voltage.high.threshold=250

# Test deduplication
rms.deduplication.suppression.window.hours=24

# Default tenant
rms.default.tenant.id=pg

# System user
egov.user.host=http://localhost:8281
egov.user.search.path=/user/_search
egov.internal.microservice.user.uuid=test-system-user-uuid

# Logging
logging.level.org.egov.rms=DEBUG
logging.level.org.springframework.web=WARN

