<!doctype html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>E4H Management Hub</title>
  <!--[if mso]>
  <xml>
    <o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
  <style>
    body,table,td,a{ font-family:Arial,Helvetica,sans-serif; }
    img{ border:0; outline:none; line-height:100%; display:block; }
    table{ border-collapse:collapse !important; }
    a{ text-decoration:none; }

    @media screen and (max-width:600px){
      .stack{ display:block !important; width:100% !important; text-align:center !important; }
      .card{ padding:16px !important; }
    }
  </style>
</head>
<!-- Styles are inline on every element: most clients drop the <style> block on forward. -->
<body style="margin:0;padding:0;background:#ffffff;">
<div style="width:100%;background:#ffffff;padding:24px 0;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;margin:0 auto;">
    <tr>
      <td>
        <table role="presentation" class="card" cellspacing="0" cellpadding="0" border="0" width="100%"
               style="border:1px solid #e5e7eb;border-radius:12px;padding:24px;">

          <tr>
            <td style="padding-bottom:20px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td class="stack" align="left" style="width:25%;">
                    <img src="${SELCO_LOGO}" alt="SELCO Foundation" width="96" style="height:auto;">
                  </td>
                  <td class="stack" align="center" style="width:75%;">
                    <h1 style="margin:0;font-size:20px;line-height:26px;color:#1f2937;font-weight:700;">${TITLE}</h1>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td>
              <p style="margin:0 0 12px;font-size:15px;line-height:22px;color:#1f2937;">Hello ${NAME},</p>
              <p style="margin:0 0 16px;font-size:15px;line-height:22px;color:#1f2937;">${OPENING}</p>

              <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                     style="margin:0 0 16px;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;">
                ${DETAIL_ROWS}
              </table>

              <p style="margin:0 0 12px;font-size:14px;line-height:21px;color:#1f2937;">
                Web users: please log in and set a new password when prompted.
              </p>
              <p style="margin:0 0 12px;font-size:14px;line-height:21px;color:#1f2937;">
                Regards,<br>SELCO Foundation
              </p>
              <p style="margin:20px 0 0;font-size:12px;line-height:18px;color:#6b7280;">
                This is an automated email; please do not reply to it.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
</body>
</html>
