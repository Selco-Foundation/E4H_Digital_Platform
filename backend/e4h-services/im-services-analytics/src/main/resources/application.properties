#....................... Weekly User Analytics Report ................................#
# Read-side of the shared user-analytics-event topic that every module's UserAnalyticsEvent
# producer writes into (im-services SEM + login, health-facility-registry, boundary-service,
# amc-scheduler-service, project, field-planner, field-planner-activity).
user.analytics.es.index=user-analytics-report
# Field paths are config because the index mapping decides whether a string aggregates directly
# or only via a .keyword sub-field — change these here if the mapping changes.
user.analytics.field.event.time=Data.event_time
user.analytics.field.event.type=Data.event_type
user.analytics.field.application=Data.application
user.analytics.field.state=Data.state
user.analytics.field.role=Data.primary_role
user.analytics.field.user=Data.user.uuid.keyword
# Active-user counts stay exact up to this many distinct users, approximate beyond it.
user.analytics.cardinality.precision.threshold=40000
user.analytics.terms.size=500
# Champion users listed per role and per application, ranked on non-login activity.
user.analytics.champion.count=5
# Monday-to-Sunday weeks are cut on this zone, not UTC.
user.analytics.report.zone=Asia/Kolkata