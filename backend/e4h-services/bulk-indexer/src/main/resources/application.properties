server.contextPath=/bulk-indexer
server.servlet.context-path=/bulk-indexer
management.endpoints.web.base-path=/
server.port=8100
app.timezone=UTC

# KAFKA SERVER CONFIGURATIONS
kafka.config.bootstrap_server_config=${KAFKA_HOST:http://localhost:9092}
spring.kafka.consumer.bootstrap-servers=${kafka.config.bootstrap_server_config}
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=bulk-indexer-grp
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# KAFKA CONSUMER CONFIGURATIONS
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest
# Batches are large and each one is several ES round-trips, so take few per poll and allow a long
# gap between polls before the broker assumes this consumer is dead and rebalances.
spring.kafka.consumer.max-poll-records=5
spring.kafka.consumer.properties.max.poll.interval.ms=600000
# One message holds every month of a facility's lifecycle; the 1MB default is uncomfortably close.
spring.kafka.consumer.properties.max.partition.fetch.bytes=10485760
spring.kafka.consumer.properties.fetch.max.bytes=52428800

# The topic every producer publishes bulk batches to. Each message names its own target index.
kafka.topics.bulk-index-documents=bulk-index-documents

#....................... Elasticsearch ..............................................#
egov.bulkindexer.es.host.name=${ES_HOST:http://localhost}
egov.bulkindexer.es.port.no=${ES_PORT:9200}
egov.bulkindexer.es.username=${ES_USERNAME:elastic}
egov.bulkindexer.es.password=${ES_PASSWORD:}
# Documents per _bulk request.
egov.bulkindexer.es.bulk.chunk.size=1000

#....................... Observability ..............................................#
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true

logging.pattern.console=%clr(%X{CORRELATION_ID:-}) %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

#------------------------------ TRACER CONFIGURATIONS -----------------------------#
tracer.detailed.tracing.enabled=true
egov.statelevel.tenantId=pb
