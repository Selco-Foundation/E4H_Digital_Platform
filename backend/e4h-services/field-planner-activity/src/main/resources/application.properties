server.servlet.context-path=/activity
server.port=8090
app.timezone=UTC
# REDIS CONFIG
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
# Seconds
spring.cache.redis.time-to-live=60
spring.cache.autoexpiry=true
# DATABASE CONFIG
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
# FLYWAY CONFIG
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.table=public
spring.flyway.baseline-on-migrate=false
spring.flyway.outOfOrder=false
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=false
# TRACER CONFIG
# KAFKA SERVER CONFIG
kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=project
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# KAFKA CONSUMER CONFIG
kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest
# KAFKA PRODUCER CONFIG
kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432
# IDGEN CONFIG
# egov.idgen.host=https://dev.digit.org/
#egov.idgen.host=https://health-dev.digit.org/
egov.idgen.host=http://localhost:8288/
egov.idgen.path=egov-idgen/id/_generate
egov.idgen.integration.enabled=true
fieldplan.facility.idgen.id.format=fieldplan.facility.id
# The value of the following field should be changed to service specific name
kafka.topics.consumer=project-consumer-topic
# MDMS CONFIG
egov.mdms.host=http://localhost:8285
egov.mdms.search.endpoint=/egov-mdms-service/v1/_search
egov.mdms.master.name=project_master
egov.mdms.module.name=project
egov.mdms.integration.enabled=true
# FIELDPLAN SERVICE
egov.fieldplan.host=http://localhost:8088
egov.search.fieldplan.url=/field-planner/v1/field-plans/_search
# use the value as "egov-user" to validate against egov-user service
# use the value as "individual" to validate against individual service
egov.user.id.validator=individual
# FACILITY SERVICE
egov.facility.host=http://localhost:8083
egov.search.facility.url=/facility/v1/_search
egov.v2.search.facility.url=/facility-service/v2/facility/search
# PDF SERVICE
egov.pdf.host=http://localhost:8096
egov.createnosave.pdf.url=/pdf-service/v1/_createnosave
egov.pdf.key=bom-receipt
# Boundary Service
egov.location.host=http://localhost:8082
egov.location.context.path=/boundary-service
egov.location.endpoint=/boundary/_search
egov.location.code.query.param=codes
# ACTIVITY KAFKA CONFIG
search.api.limit=1000
project.default.offset=0
project.default.limit=100
project.search.max.limit=200
fieldPlan.management.system.kafka.create.topic=save-field-plan
activity.assignment.kafka.create.topic=save-activity-assignment-topic
activity.assignment.consumer.bulk.create.topic=save-activity-assignment-bulk-topic
activity.facility.kafka.create.topic=save-activity-facility-topic
activity.facility.consumer.bulk.create.topic=save-activity-facility-bulk-topic
activity.kafka.update.topic=update-activity-facility
bom.kafka.create.topic=save-bom-topic
bom.kafka.update.topic=update-bom-topic
# BOUNDARY SERVICE
egov.boundary.host=http://localhost:8082
egov.boundary.search.url=/boundary-service/boundary/_search
egov.boundary.hierarchy=HCM-Moz-Hierarchy
egov.boundary.search.endpoint=/boundary-service/boundary-relationships/_search
project.document.id.verification.required=false
project.mdms.module=HCM-PROJECT-TYPES
task.mdms.module=HCM-TASK-QUANTITY-VALIDATION
egov.location.hierarchy.type=ADMIN

#Workflow
egov.workflow.host=http://localhost:8089
egov.workflow.transition.path=/egov-workflow-v2/egov-wf/process/_transition
egov.workflow.module.name=Workflow
egov.workflow.business.service=FACILITY_INSTALLATION
egov.workflow.search.path=/egov-workflow-v2/egov-wf/process/_search

#HRMS
egov.hrms.host=http://localhost:8988
egov.hrms.search.url=/egov-hrms/employees/_search